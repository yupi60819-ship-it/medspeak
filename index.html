<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedSpeak</title>
<meta name="description" content="医師のための英語スピーキング特訓アプリ">
<meta name="theme-color" content="#F3F6F5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MedSpeak">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,600&display=swap">
<style>
/* ============================================================
   MedSpeak — デザイン
   ライト=カルテ用紙 / ダーク=夜勤のバイタルモニター
   ============================================================ */
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --surface-2:#EDF2F0; --surface-3:#E3EAE7;
  --ink:#14201D; --ink-2:#465753; --ink-3:#7A8A85; --line:#D6DFDB; --line-2:#C3CFCA;
  --accent:#0B7A6F; --accent-2:#08645B; --accent-ink:#FFFFFF; --accent-soft:#DCEEEA;
  --redpen:#CF3E27; --redpen-soft:#FBE7E2;
  --good:#1D8A56; --good-soft:#DDF1E6; --warn:#A86A0C; --warn-soft:#F7ECD8; --bad:#C3362B; --bad-soft:#F8E1DE;
  --daily:#2F66AD; --daily-soft:#E1EAF6; --medical:#0B7A6F; --medical-soft:#DCEEEA; --research:#7446B0; --research-soft:#EDE5F7;
  --grid:rgba(207,62,39,.07); --grid-strong:rgba(207,62,39,.13);
  --shadow:0 1px 2px rgba(20,32,29,.05),0 6px 20px -8px rgba(20,32,29,.14);
  --radius:14px; --radius-sm:10px;
  --f-ui:"IBM Plex Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-en:"Source Serif 4","Iowan Old Style","Georgia","Times New Roman",serif;
  --f-mono:"IBM Plex Mono","SF Mono","Menlo","Consolas",monospace;
  --nav-w:236px; --tab-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B1412; --surface:#111D1A; --surface-2:#172622; --surface-3:#1E302B;
    --ink:#E2EEEA; --ink-2:#A7B9B3; --ink-3:#71847E; --line:#233531; --line-2:#2E4640;
    --accent:#35C9AF; --accent-2:#5FD9C3; --accent-ink:#04211C; --accent-soft:#123A34;
    --redpen:#FF7A5C; --redpen-soft:#3A1D16;
    --good:#44D38F; --good-soft:#123324; --warn:#F2B452; --warn-soft:#3A2B12; --bad:#FF6B5E; --bad-soft:#3B1916;
    --daily:#7AAEF2; --daily-soft:#16273D; --medical:#35C9AF; --medical-soft:#123A34; --research:#B79AF2; --research-soft:#261D3B;
    --grid:rgba(53,201,175,.06); --grid-strong:rgba(53,201,175,.12);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1412; --surface:#111D1A; --surface-2:#172622; --surface-3:#1E302B;
  --ink:#E2EEEA; --ink-2:#A7B9B3; --ink-3:#71847E; --line:#233531; --line-2:#2E4640;
  --accent:#35C9AF; --accent-2:#5FD9C3; --accent-ink:#04211C; --accent-soft:#123A34;
  --redpen:#FF7A5C; --redpen-soft:#3A1D16;
  --good:#44D38F; --good-soft:#123324; --warn:#F2B452; --warn-soft:#3A2B12; --bad:#FF6B5E; --bad-soft:#3B1916;
  --daily:#7AAEF2; --daily-soft:#16273D; --medical:#35C9AF; --medical-soft:#123A34; --research:#B79AF2; --research-soft:#261D3B;
  --grid:rgba(53,201,175,.06); --grid-strong:rgba(53,201,175,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
[hidden]{display:none!important}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.small{font-size:13px}.tiny{font-size:11.5px}
.en{font-family:var(--f-en);font-size:1.12em;line-height:1.5;letter-spacing:.005em}
.ja{color:var(--ink-2);font-size:13.5px}
.nowrap{white-space:nowrap}

/* ---------- 骨組み ---------- */
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.wordmark{display:flex;align-items:center;gap:7px;font-weight:700;font-size:18px;letter-spacing:.01em;margin-right:auto;color:var(--ink)}
.wordmark .pulse{width:26px;height:18px;color:var(--accent)}
.wordmark b{font-family:var(--f-en);font-style:italic;font-weight:600;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink)}
.chip:hover{border-color:var(--line-2)}
.chip .flame{color:var(--redpen)}
.chip.streak-off .flame{color:var(--ink-3)}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.chip.member{padding:0 10px 0 4px;max-width:150px}
.chip span:not(.avatar){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{flex:none}
.icon-btn{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

main{padding:4px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px));max-width:780px;margin:0 auto}
.view{display:none;animation:viewin .22s ease-out}
.view.on{display:block}
@keyframes viewin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:0 4px env(safe-area-inset-bottom,0px)}
.nav .nav-head,.nav .nav-foot{display:none}
.nav-item{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--ink-3);position:relative;letter-spacing:.02em}
.nav-item .ic{width:23px;height:23px}
.nav-item.on{color:var(--accent)}
.nav-item.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav-item .badge-dot{position:absolute;top:10px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--redpen);color:#fff;font-size:10px;line-height:16px;font-family:var(--f-mono)}

@media (min-width:960px){
  .topbar{display:none}
  .nav{top:0;bottom:0;right:auto;width:var(--nav-w);flex-direction:column;border-top:0;border-right:1px solid var(--line);
    padding:calc(22px + env(safe-area-inset-top,0px)) 14px 18px;gap:2px}
  .nav .nav-head{display:flex;padding:0 10px 22px}
  .nav-item{flex:none;height:44px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:11px;font-size:14px;color:var(--ink-2)}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.on{background:var(--accent-soft);color:var(--accent)}
  .nav-item.on::before{display:none}
  .nav-item .badge-dot{position:static;margin-left:auto}
  .nav .nav-foot{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  main{margin-left:var(--nav-w);max-width:none;padding:34px 40px 60px}
  main>.view{max-width:760px;margin:0 auto}
}

/* ---------- 共通部品 ---------- */
.vh{display:flex;align-items:flex-end;gap:12px;margin:14px 0 16px}
.vh h1{font-size:23px;font-weight:700;letter-spacing:.01em}
.vh .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.vh .grow{flex:1;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card+.card,.stack>*+*{margin-top:12px}
.card h2{font-size:16px;font-weight:700}
.card h3{font-size:14.5px;font-weight:700}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.grow{flex:1;min-width:0}
.sep{height:1px;background:var(--line);margin:14px 0}
.center{text-align:center}
.mt{margin-top:12px}.mt-s{margin-top:6px}.mt-l{margin-top:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;border:1px solid transparent;transition:background .15s,transform .1s}
.btn:hover{background:var(--accent-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.quiet{background:transparent;color:var(--ink-2);padding:0 10px}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{height:34px;padding:0 13px;font-size:13px;border-radius:10px}
.btn.lg{height:50px;padding:0 24px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn .ic{width:18px;height:18px}
.linkbtn{color:var(--accent);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px;padding:4px 2px}
.linkbtn:hover{text-decoration:underline}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.full{display:flex}.seg.full button{flex:1}

.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.tag.daily{background:var(--daily-soft);color:var(--daily)}
.tag.medical{background:var(--medical-soft);color:var(--medical)}
.tag.research{background:var(--research-soft);color:var(--research)}
.tag.neutral{background:var(--surface-2);color:var(--ink-2)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.red{background:var(--redpen-soft);color:var(--redpen)}

.list-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);transition:border-color .15s,background .15s}
.list-item:hover{border-color:var(--line-2);background:color-mix(in srgb,var(--surface) 70%,var(--surface-2))}
.list-item+.list-item{margin-top:8px}
.list-item .t{font-weight:700;font-size:14.5px}
.list-item .d{font-size:12.5px;color:var(--ink-2)}
.list-item .chev{color:var(--ink-3)}
.mono-tile{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:none;font-family:var(--f-mono);
  font-size:12.5px;font-weight:600;line-height:1.05;text-align:center}
.mono-tile.daily{background:var(--daily-soft);color:var(--daily)}
.mono-tile.medical{background:var(--medical-soft);color:var(--medical)}
.mono-tile.research{background:var(--research-soft);color:var(--research)}
.mono-tile.neutral{background:var(--surface-2);color:var(--ink-2)}
.mono-tile .ic{width:22px;height:22px}

.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}
@media (max-width:639px){.grid-3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--line);text-align:left;min-height:124px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent)}
.tile .t{font-weight:700;font-size:15px;line-height:1.35}
.tile .d{font-size:12px;color:var(--ink-2);line-height:1.5}
.tile .mono-tile{width:40px;height:40px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;min-height:42px;padding:9px 12px;border-radius:11px;background:var(--surface);
  border:1px solid var(--line-2);font-size:15px}
textarea.input{resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.setting{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting .grow .t{font-weight:600;font-size:14.5px}
.setting .grow .d{font-size:12px;color:var(--ink-2);margin-top:1px}
.toggle{position:relative;width:48px;height:28px;border-radius:14px;background:var(--surface-3);border:1px solid var(--line-2);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked="true"]::after{left:22px}
input[type=range]{width:100%;accent-color:var(--accent)}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:13px;line-height:1.6}
.notice .ic{color:var(--warn);margin-top:2px}
.notice.info{background:var(--accent-soft)}
.notice.info .ic{color:var(--accent)}

/* ---------- 処方箋(今日のメニュー) ---------- */
.rx{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 16px;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:12px 12px;background-position:-1px -1px}
.rx::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.rx-head{display:flex;align-items:flex-start;gap:14px}
.rx-mark{font-family:var(--f-en);font-style:italic;font-weight:600;font-size:40px;line-height:.9;color:var(--accent);letter-spacing:-.02em}
.rx-meta{flex:1;min-width:0}
.rx-meta .eyebrow{margin-bottom:3px}
.rx-meta h2{font-size:18px;font-weight:700}
.rx-meta .sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.rx-lines{list-style:none;margin:16px 0 4px;padding:0;border-top:1px dashed var(--line-2)}
.rx-line{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line-2)}
.rx-line .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);width:18px}
.rx-line .what{flex:1;min-width:0}
.rx-line .what .t{font-weight:700;font-size:14.5px}
.rx-line .what .d{font-size:12px;color:var(--ink-2)}
.rx-line .dose{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rx-line.done .what .t{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px;color:var(--ink-2)}
.rx-line .check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
.rx-line.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rx-line.bonus .what .t::after{white-space:nowrap;content:"ボーナス";margin-left:8px;font-size:10.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:1px 5px;vertical-align:1px}
.rx-foot{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.stamp{position:absolute;right:18px;top:16px;width:92px;height:92px;border-radius:50%;border:3px double var(--redpen);color:var(--redpen);
  display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1.1;text-align:center;transform:rotate(-14deg);opacity:.9;
  background:color-mix(in srgb,var(--surface) 55%,transparent);pointer-events:none}
.stamp span{display:block;font-size:30px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.stamp.anim{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-14deg) scale(2.2);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:.9}}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:2px}
.stat .l{font-size:11.5px;color:var(--ink-2);margin-top:4px}

.levelcard{display:flex;align-items:center;gap:14px}
.badge-id{width:54px;height:54px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none;text-align:center}
.badge-id .lv{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;opacity:.75}
.badge-id .n{font-family:var(--f-mono);font-size:22px;font-weight:600;line-height:1}
.xpbar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.xpbar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}

/* ---------- 読み上げ文・採点 ---------- */
.prompt-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px}
.prompt-card .lead{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;margin-bottom:6px}
.target{font-family:var(--f-en);font-size:21px;line-height:1.5;font-weight:500;letter-spacing:.003em}
.target.ja-prompt{font-family:var(--f-ui);font-size:19px;font-weight:700;line-height:1.55}
.target.blur{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .2s}
.target .w{border-radius:4px;padding:0 1px}
.w-ok{color:var(--good)}
.w-near{color:var(--warn);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:4px}
.w-miss{color:var(--bad);text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:4px}
.target-ja{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

.readout{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.readout .val{font-family:var(--f-mono);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;min-width:86px}
.readout .val small{font-size:15px;margin-left:2px;opacity:.7}
.readout .lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-3)}
.readout .msg{font-weight:700;font-size:14px}
.readout .heard{font-size:13px;color:var(--ink-2);margin-top:3px;word-break:break-word}
.readout.good .val,.readout.good .msg{color:var(--good)}
.readout.mid .val,.readout.mid .msg{color:var(--warn)}
.readout.bad .val,.readout.bad .msg{color:var(--bad)}
.result{margin-top:12px}

/* ---------- マイク・入力 ---------- */
.speak{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.trace{width:100%;max-width:440px;height:54px;display:block;border-radius:10px;
  background-color:var(--surface-2);
  background-image:linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px);
  background-size:10px 10px}
.interim{min-height:22px;font-family:var(--f-en);font-size:16px;color:var(--ink-2);text-align:center;padding:0 6px;word-break:break-word}
.mic{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative;
  box-shadow:0 8px 20px -6px color-mix(in srgb,var(--accent) 60%,transparent);transition:transform .12s,background .15s}
.mic .ic{width:32px;height:32px}
.mic:hover{transform:scale(1.04)}
.mic.on{background:var(--redpen)}
.mic.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--redpen);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.25);opacity:0}}
.speak-hint{font-size:12.5px;color:var(--ink-2);text-align:center;min-height:19px}
.typebox{width:100%;display:flex;gap:8px;align-items:flex-end}
.typebox textarea{flex:1;min-height:46px;max-height:150px;font-family:var(--f-en);font-size:16px}
.typebox .btn{height:46px}
.kbd-tip{font-size:12px;color:var(--ink-3);text-align:center;line-height:1.55}
.kbd-tip b{color:var(--ink-2)}

/* ---------- 会話 ---------- */
.chat{display:flex;flex-direction:column;gap:12px;padding:6px 0 4px}
.msg{max-width:86%;display:flex;flex-direction:column;gap:6px}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{padding:11px 14px 10px;border-radius:16px;line-height:1.5;position:relative;word-break:break-word}
.msg.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me .bubble{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-bottom-right-radius:5px}
.bubble .en{font-size:16.5px}
.bubble .ja{margin-top:4px}
.bubble .say{position:absolute;right:-12px;top:-10px;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2)}
.bubble .say:hover{color:var(--accent);border-color:var(--accent)}
.bubble .say .ic{width:14px;height:14px}
.msg .who{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;padding:0 4px}
.msg .score{font-family:var(--f-mono);font-size:11.5px;font-weight:600}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.redpen{align-self:stretch;max-width:100%;border:1px solid color-mix(in srgb,var(--redpen) 35%,transparent);background:var(--redpen-soft);
  border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.55}
.redpen .lab{display:flex;align-items:center;gap:6px;color:var(--redpen);font-weight:700;font-size:11.5px;letter-spacing:.06em}
.redpen .better{font-family:var(--f-en);font-size:15.5px;color:var(--ink);margin-top:3px}
.redpen .why{color:var(--ink-2);margin-top:2px}
.redpen .ok{color:var(--good);font-weight:700}
.hints{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.hint-chip{text-align:left;padding:9px 12px;border-radius:11px;background:var(--surface);border:1px dashed var(--line-2);font-family:var(--f-en);font-size:14.5px;color:var(--ink)}
.hint-chip:hover{border-style:solid;border-color:var(--accent)}
.hint-chip .ja{font-family:var(--f-ui);font-size:11.5px;display:block;margin-top:2px}
.engine{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:14px;font-size:12px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.engine i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.engine.live i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.engine.local i{background:var(--warn)}

.scorebars{display:grid;gap:9px}
.sbar{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.sbar .track{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.sbar .track i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.sbar .n{font-family:var(--f-mono);text-align:right;font-weight:600}
.fix{padding:11px 0;border-bottom:1px dashed var(--line-2)}
.fix:last-child{border-bottom:0}
.fix .you{font-family:var(--f-en);color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--redpen)}
.fix .better{font-family:var(--f-en);font-size:16px;margin-top:2px}
.fix .why{font-size:12.5px;color:var(--ink-2);margin-top:2px}

/* ---------- フラッシュカード ---------- */
.flash{position:relative;min-height:190px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:26px 20px;cursor:pointer;box-shadow:var(--shadow)}
.flash .front{font-size:19px;font-weight:700;line-height:1.55}
.flash .back{margin-top:14px;font-family:var(--f-en);font-size:21px;line-height:1.45}
.flash .flip-hint{font-size:12px;color:var(--ink-3);margin-top:14px}
.flash .corner{position:absolute;top:12px;left:14px}
.flash{padding-top:44px}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.grade button{height:56px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.grade button small{font-weight:500;font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
.grade .g0:hover{border-color:var(--bad);color:var(--bad)}
.grade .g1:hover{border-color:var(--warn);color:var(--warn)}
.grade .g2:hover{border-color:var(--good);color:var(--good)}

/* ---------- 瞬間英作文・タイマー ---------- */
.timer{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:14px 0 6px}
.timer>i{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.timer.low>i{background:var(--redpen)}
.countdown{font-family:var(--f-mono);font-size:30px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.big-ja{font-size:22px;font-weight:700;text-align:center;line-height:1.55;margin:10px 0 4px;text-wrap:balance}
.res-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.res-row:last-child{border-bottom:0}
.res-row .grow .en{font-size:15px}
.res-row .pct{font-family:var(--f-mono);font-weight:600;white-space:nowrap}

/* 道場 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pair button{height:84px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);font-family:var(--f-en);font-size:26px;font-weight:600}
.pair button:hover{border-color:var(--accent)}
.pair button.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.pair button.ng{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.steps{display:flex;gap:6px}
.steps span{font-family:var(--f-mono);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:9px;border:1px solid var(--line-2);color:var(--ink-3)}
.steps span.now{border-color:var(--accent);color:var(--accent)}
.steps span.done{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs .p{padding:12px;border-radius:12px;border:1px solid var(--line);text-align:center;background:var(--surface)}
.vs .p.turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.vs .p .sc{font-family:var(--f-mono);font-size:24px;font-weight:600}
.vs .x{font-weight:800;color:var(--ink-3);font-family:var(--f-mono)}
.checklist .ci{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.checklist .ci:last-child{border-bottom:0}
.checklist .ci .mark{font-family:var(--f-mono);font-weight:700;width:18px}
.checklist .ci.hit .mark{color:var(--good)}
.checklist .ci.miss .mark{color:var(--bad)}

/* ---------- 記録 ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--surface-3)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 28%,var(--surface-3))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 52%,var(--surface-3))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 76%,var(--surface-3))}
.heat i.l4{background:var(--accent)}
.heat i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:10px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bars .b i{display:block;width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.bars .b.today i{background:var(--redpen)}
.bars .b span{position:absolute;top:-14px;font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
.bar-labels{display:flex;gap:5px;margin-top:4px}
.bar-labels span{flex:1;text-align:center;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3)}
.catrow{display:grid;grid-template-columns:48px 1fr 70px;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.catrow .track{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.catrow .track i{display:block;height:100%;border-radius:5px}
.catrow .n{font-family:var(--f-mono);text-align:right;font-size:12.5px;color:var(--ink-2)}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.medal{border:1px dashed var(--line-2);border-radius:12px;padding:12px 8px;text-align:center;color:var(--ink-3)}
.medal .m{font-family:var(--f-mono);font-size:20px;font-weight:700}
.medal .t{font-size:12px;font-weight:700;margin-top:2px}
.medal .p{font-size:11px;font-family:var(--f-mono)}
.medal.got{border:1.5px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.rank{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .pos{font-family:var(--f-mono);font-weight:700;width:22px;text-align:center;color:var(--ink-3)}
.rank.me{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent;padding:10px 8px}
.rank .v{font-family:var(--f-mono);font-weight:600}
.cert{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:12px;display:block}
.ms{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px}
.ms .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.ms.got .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ms.got{color:var(--ink)}
.ms:not(.got){color:var(--ink-3)}
.rec-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.rec-item:last-child{border-bottom:0}

/* 90日カレンダー */
.weeks{display:grid;gap:10px}
.week .wh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:12.5px;font-weight:700}
.week .wh .faint{font-weight:500}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{aspect-ratio:1/1;max-width:100%;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.1}
.day small{font-family:var(--f-ui);font-size:9px;font-weight:600;color:var(--ink-3)}
.day.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.day.cur{border:2px solid var(--redpen);color:var(--ink)}

/* ---------- ダイアログ・トースト ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(8,14,12,.5);display:flex;align-items:flex-end;justify-content:center;
  padding:16px;animation:fadein .15s}
@media (min-width:640px){.overlay{align-items:center}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dialog{width:100%;max-width:460px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px;padding:20px;border:1px solid var(--line);
  box-shadow:0 20px 50px -12px rgba(0,0,0,.4);animation:popin .2s ease-out}
@keyframes popin{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
.dialog h2{font-size:17px;margin-bottom:8px}
.dialog .body{font-size:14px;color:var(--ink-2);line-height:1.65}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
@media (min-width:960px){.toasts{bottom:28px;left:calc(50% + var(--nav-w)/2)}}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);
  animation:toastin .25s ease-out;text-align:center}
.toast.lv{background:var(--accent);color:var(--accent-ink)}
@keyframes toastin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.member-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.member-row.on{border-color:var(--accent);background:var(--accent-soft)}
.member-row .t{font-weight:700;font-size:14.5px}
.member-row .d{font-size:11.5px;color:var(--ink-2);font-family:var(--f-mono)}

.empty{padding:26px 10px;text-align:center;color:var(--ink-2);font-size:13.5px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink-2)}
.backbar{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.backbar .t{font-size:13px;color:var(--ink-2);font-weight:600}
.progress-dots{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Macアプリ:タイトルバー一体型ウインドウの余白 */
.mac-app .topbar{padding-top:34px}
@media (min-width:960px){.mac-app .nav{padding-top:50px}.mac-app main{padding-top:46px}}

.rx-line .dose-m{display:none;font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-top:2px}
@media (max-width:520px){
  .vh h1{font-size:20px}
  .rx{padding:18px 14px 14px 18px}
  .rx-mark{font-size:34px}
  .rx-line{gap:10px}
  .rx-line .no,.rx-line .dose{display:none}
  .rx-line .dose-m{display:block}
  .stamp{width:78px;height:78px;right:10px;top:10px;font-size:13px}
  .stamp span{font-size:24px}
}

</style>

  {id:'m9',cat:'medical',title:'術後回診',desc:'術後1日目の患者を診察',

  {id:'m10',cat:'medical',title:'退院指導',desc:'退院前の生活指導',

  {id:'m11',cat:'medical',title:'悪い知らせを伝える',desc:'病理結果の説明(SPIKES)',

  {id:'r1',cat:'research',title:'自分の研究を説明',desc:'共同研究者に概要説明',

    ['ai',"So, could you walk me through your current project?","今の研究を説明してもらえますか?"],

  {id:'r2',cat:'research',title:'学会発表の質疑応答',desc:'発表後のQ&A',

  {id:'r3',cat:'research',title:'論文について議論',desc:'共著者と原稿の打合せ',

  {id:'r4',cat:'research',title:'研究費の面接審査',desc:'助成審査での説明',
   turns:[
    ['ai',"Tell us why this research deserves funding.","なぜこの研究に助成が必要か教えてください。"],

  {id:'r5',cat:'research',title:'データ・統計を議論',desc:'解析結果の相談',
   turns:[
    ['ai',"Your p-value looks significant, but is the effect meaningful?","p値は有意ですが、効果は臨床的に意味がありますか?"],

    ['user',"Yes, and we used a non-parametric test where needed.","はい、必要な箇所はノンパラメトリック検定を使いました。"],
    ['ai',"How did you handle missing data?","欠損データはどう処理?"],
    ['user',"We used multiple imputation to reduce bias.","多重代入でバイアスを減らしました。"],
    ['ai',"That's rigorous. What's the next analysis step?","厳密ですね。次の解析は?"],
    ['user',"We'll run a sensitivity analysis to confirm robustness.","頑健性を確認するため感度分析を行います。"]]},
  {id:'r6',cat:'research',title:'国際共同研究の立ち上げ',desc:'海外ラボと連携',

  {id:'r7',cat:'research',title:'ポスター発表',desc:'ポスターの前で説明',

/* ---------- 90日カリキュラム ---------- */
function buildCurriculum(){
  const days=[];
  const byCat=c=>SCENARIOS.filter(s=>s.cat===c).map(s=>s.id);
  const phases=[['daily','日常会話'],['medical','医療英語'],['research','研究・アカデミック']];
  for(let d=1;d<=90;d++){
    const p=Math.floor((d-1)/30), local=(d-1)%30;
    const ids=byCat(phases[p][0]);
    let scenario,mode;
    if(local<24){scenario=ids[Math.floor(local/2)%ids.length];mode=local%2===0?'guided':'recall';}
    else{scenario=ids[((local-24)*2)%ids.length];mode='free';}
    days.push({day:d,phase:p+1,cat:phases[p][0],catLabel:phases[p][1],scenario,mode,
      week:Math.floor((d-1)/7)+1});
  }
  return days;
}

  const isAndroid=/Android/.test(ua);

  return {native,artifact,isIOS,isMac,isAndroid,standalone,http:/^https?:$/.test(location.protocol)};
})();

/* ---------- 保存(localStorage が使えない環境ではメモリに退避) ---------- */
const Store={
  mem:{},
  get(k){try{const v=localStorage.getItem(k);return v===null&&k in this.mem?this.mem[k]:v;}catch(e){return k in this.mem?this.mem[k]:null;}},
  set(k,v){this.mem[k]=v;try{localStorage.setItem(k,v);}catch(e){}},
  del(k){delete this.mem[k];try{localStorage.removeItem(k);}catch(e){}},
  json(k,def){const v=this.get(k);if(v==null)return def;try{return JSON.parse(v);}catch(e){return def;}},
  put(k,v){this.set(k,JSON.stringify(v));}
};

const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr=()=>dstr(new Date());
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return dstr(new Date(y,m-1,d+n));}
function daysBetween(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);
  return Math.round((new Date(pb[0],pb[1]-1,pb[2])-new Date(pa[0],pa[1]-1,pa[2]))/86400000);}

function defaultSettings(){return {voice:'',rate:1.0,autoSpeak:true,showJa:true,inputMode:'auto',enName:'Yuta',newPerDay:10};}
function defaultState(){
  return {v:3,streak:0,bestStreak:0,lastStudy:null,totalMin:0,xp:0,
    attempts:[],daysDone:{},curDay:1,settings:defaultSettings(),
    srs:{},weak:{},mp:{},log:{},day:null,myPhrases:[],aiHist:[],osce:{},roles:{}};
}
function migrateState(raw){
  const s=Object.assign(defaultState(),raw||{});
  s.settings=Object.assign(defaultSettings(),(raw&&raw.settings)||{});
  ['srs','weak','mp','log','daysDone','osce','roles'].forEach(k=>{if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))s[k]={};});
  ['attempts','myPhrases','aiHist'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(!raw||raw.v!==3){
    /* 旧版からの移行:発話回数と完了日数から経験値を概算し、日別ログを再構成 */
    if(!raw||typeof raw.xp!=='number')s.xp=s.attempts.length*5+Object.keys(s.daysDone).length*40;
    s.attempts.forEach(a=>{if(!a||!a.date)return;const L=s.log[a.date]||(s.log[a.date]={n:0,xp:0,sec:0});L.n++;});
    s.bestStreak=Math.max(s.bestStreak||0,s.streak||0);
    s.v=3;
  }
  if(s.curDay<1||s.curDay>90)s.curDay=Math.min(90,Math.max(1,s.curDay|0||1));
  return s;
}

/* ---------- 学習ログ・連続日数・学習時間 ---------- */
function dayLog(d){d=d||todayStr();return S.log[d]||(S.log[d]={n:0,xp:0,sec:0});}
function currentStreak(st){st=st||S;const t=todayStr();
  if(!st.lastStudy)return 0;
  const gap=daysBetween(st.lastStudy,t);
  return gap<=1?(st.streak||0):0;}
function touchStudy(){
  const t=todayStr();
  if(S.lastStudy!==t){
    const gap=S.lastStudy?daysBetween(S.lastStudy,t):99;
    S.streak=(gap===1)?(S.streak||0)+1:1;
    S.lastStudy=t;
    S.bestStreak=Math.max(S.bestStreak||0,S.streak);
  }
}
let _lastActive=0;
/* 操作の間隔から実際の学習時間を積算(2分以上空いたら休憩とみなす) */
function markActive(){
  const now=Date.now();
  if(_lastActive&&now-_lastActive<120000){dayLog().sec+=Math.round((now-_lastActive)/1000);}
  _lastActive=now;
}
function totalMinutes(st){st=st||S;let sec=0;Object.values(st.log||{}).forEach(L=>sec+=(L.sec||0));return (st.totalMin||0)+Math.round(sec/60);}
function todayMinutes(){return Math.round((dayLog().sec||0)/60);}

function levelOf(xp){let i=0;while(i+1<LEVELS.length&&xp>=LEVELS[i+1].xp)i++;
  const cur=LEVELS[i],nx=LEVELS[i+1];
  return {n:i+1,ja:cur.ja,en:cur.en,base:cur.xp,next:nx?nx.xp:null,pct:nx?Math.round((xp-cur.xp)/(nx.xp-cur.xp)*100):100};}
function addXP(n){
  if(!n)return;
  const before=levelOf(S.xp||0).n;
  S.xp=(S.xp||0)+n;dayLog().xp+=n;
  const L=levelOf(S.xp);
  if(L.n>before)setTimeout(()=>toast(`レベルアップ!Lv.${L.n} ${L.ja}(${L.en})`,'lv',4200),400);
}

/* ---------- 今日の処方(日課) ---------- */
const RX_TASKS=[
  {k:'shadow',t:'シャドーイング',unit:'文',goal:5},
  {k:'talk',t:'ロールプレイ',unit:'本',goal:1},
  {k:'review',t:'フレーズ復習',unit:'枚',goal:10}
];
const RX_BONUS={k:'ai',t:'AI会話',unit:'往復',goal:5};
function dayState(){
  const t=todayStr();
  if(!S.day||S.day.date!==t){
    /* 前日に処方を完了していたら、今日は次のDayへ進む */
    if(S.day&&S.day.done&&S.day.dayNo===S.curDay&&S.curDay<90)S.curDay++;
    S.day={date:t,dayNo:S.curDay,shadow:0,talk:0,review:0,ai:0,newCards:0,done:false};
    saveSoon();
  }
  return S.day;
}
function bumpTask(k,n){
  const D=dayState();
  D[k]=(D[k]||0)+(n||1);
  if(!D.done&&RX_TASKS.every(x=>(D[x.k]||0)>=x.goal)){
    D.done=true;
    S.daysDone[S.curDay]=todayStr();
    addXP(40);
    App.celebrate=true;
    setTimeout(()=>toast(`Day ${S.curDay} の処方を完了しました`,'lv',3800),300);
  }
  saveSoon();
  App.refreshBadges();
}

/* ---------- 発話の記録 ---------- */
function logAttempt(score,cat,en,ja,kind){
  score=Math.round(score);
  S.attempts.push({date:todayStr(),score,cat,kind:kind||''});
  if(S.attempts.length>4000)S.attempts=S.attempts.slice(-4000);
  dayLog().n++;
  if(en&&score<70&&kind!=='weak'){
    const w=S.weak[en]||{en,ja:ja||'',cat,worst:100,wins:0};
    w.worst=Math.min(w.worst,score);w.date=todayStr();w.wins=0;
    S.weak[en]=w;
  }
  addXP(4+(score>=80?4:score>=60?2:0));
  touchStudy();markActive();saveSoon();
  App.refreshHeader();
}
function avgScore(st){st=st||S;const a=st.attempts.filter(x=>x.kind!=='free');if(!a.length)return null;return Math.round(a.reduce((s,x)=>s+x.score,0)/a.length);}

/* ---------- Macアプリ(ネイティブ)との橋渡し ---------- */
const Native={
  seq:0,handlers:{},
  ok:ENV.native,
  send(msg){try{window.webkit.messageHandlers.medspeak.postMessage(msg);}catch(e){}},
  call(cmd,data,handler){const id='n'+(++this.seq);if(handler)this.handlers[id]=handler;this.send(Object.assign({cmd,id},data||{}));return id;},
  receive(ev){
    if(!ev||!ev.id)return;
    const h=this.handlers[ev.id];
    if(h){try{h(ev);}catch(e){console.error(e);}}
    if(ev.type==='end'||ev.type==='done')delete this.handlers[ev.id];
  }
};
window.MedSpeakNative={receive:ev=>Native.receive(ev)};

/* ---------- 読み上げ(TTS) ---------- */
const TTS={
  backend:ENV.native?'native':('speechSynthesis' in window?'web':'none'),
  voices:[],ready:false,forceLocal:false,_resume:null,_cur:null,
  init(){
    if(this.backend==='native'){
      Native.call('tts.voices',{},ev=>{if(ev.type==='voices'){this.voices=ev.voices||[];this.ready=true;this.pickDefault();App.onVoices();}});
    }else if(this.backend==='web'){
      const load=()=>{
        const all=speechSynthesis.getVoices()||[];
        const en=all.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));
        if(!en.length)return;
        this.voices=en.map(v=>({id:v.name,name:v.name,lang:v.lang,local:v.localService!==false,q:this.rank(v),_v:v}))
          .sort((a,b)=>b.q-a.q);
        this.ready=true;this.pickDefault();App.onVoices();
      };
      speechSynthesis.onvoiceschanged=load;load();
      let n=0;const t=setInterval(()=>{load();if(this.ready||++n>20)clearInterval(t);},300);
    }
  },
  /* 声の質を点数化(自然なニューラル音声・米語を優先) */
  rank(v){const n=(v.name||'').toLowerCase();let s=0;
    if(v.lang==='en-US')s+=5;else if(/^en-(gb|au|ca|ie|nz)/i.test(v.lang))s+=3;
    if(v.localService===false)s+=4;
    if(/natural|neural|premium|enhanced|online/.test(n))s+=9;
    if(/google/.test(n))s+=7;
    if(/samantha|ava|allison|zoe|serena|aria|jenny|guy|libby|nova|emma|michelle|evan|nathan|joelle/.test(n))s+=5;
    if(/compact|eloquence|espeak|fred|albert|zarvox|superstar|bahh|bells|boing|whisper|trinoids|junior|jester|organ|cellos|wobble|bubbles|grandma|grandpa|rocko|shelley|flo|reed|sandy|eddy/.test(n))s-=10;
    return s;},
  pickDefault(){
    if(!this.voices.length)return;
    if(!S.settings.voice||!this.voices.find(v=>v.id===S.settings.voice)){S.settings.voice=this.voices[0].id;saveSoon();}
  },
  voiceObj(){return this.voices.find(v=>v.id===S.settings.voice)||this.voices[0]||null;},
  /* 1文を読み上げ。終わったら resolve */
  speak(text,opt){
    opt=opt||{};
    text=String(text||'').trim();
    if(!text||this.backend==='none')return Promise.resolve();
    this.stop();
    const rate=opt.rate||S.settings.rate||1;
    if(this.backend==='native'){
      return new Promise(res=>{
        const v=this.voiceObj();
        const id=Native.call('tts.speak',{text,rate,voice:v?v.id:''},ev=>{
          if(ev.type==='start'&&opt.onstart)opt.onstart();
          if(ev.type==='end'){if(this._cur===id)this._cur=null;res();}
        });
        this._cur=id;
      });
    }
    return new Promise(res=>{
      setTimeout(()=>this._webSpeak(text,rate,res,null,opt),60);
    });
  },
  _webSpeak(text,rate,done,override,opt){
    let u;try{u=new SpeechSynthesisUtterance(text);}catch(e){done();return;}
    const local=()=>this.voices.find(v=>v.local)||null;
    const v=override||(this.forceLocal?local():null)||this.voiceObj();
    if(v&&v._v){u.voice=v._v;u.lang=v.lang;}else u.lang='en-US';
    u.rate=rate;u.pitch=1;u.volume=1;
    let started=false,fin=false;
    const finish=()=>{if(fin)return;fin=true;this._clear();done();};
    /* 一部の声は無音のまま始まらないことがある → 1.6秒で端末内蔵の声に切り替えて再挑戦 */
    const rescue=()=>{
      if(fin||started)return;
      const lv=local();
      if(override||!lv||(v&&lv.id===v.id)){finish();return;}
      fin=true;try{speechSynthesis.cancel();}catch(e){}this._clear();this.forceLocal=true;
      setTimeout(()=>this._webSpeak(text,rate,done,lv,opt),60);
    };
    u.onstart=()=>{started=true;if(opt&&opt.onstart)opt.onstart();};
    u.onend=finish;u.onerror=rescue;
    try{speechSynthesis.speak(u);}catch(e){finish();return;}
    setTimeout(rescue,1600);
    /* Chrome の既知の不具合(長文が約15秒で止まる)対策 */
    this._resume=setInterval(()=>{if(!speechSynthesis.speaking){this._clear();return;}try{speechSynthesis.pause();speechSynthesis.resume();}catch(e){}},12000);
  },
  _clear(){if(this._resume){clearInterval(this._resume);this._resume=null;}},
  stop(){
    if(this.backend==='native'){if(this._cur){Native.call('tts.stop',{});this._cur=null;}return;}
    if(this.backend==='web'){try{speechSynthesis.cancel();}catch(e){}this._clear();}
  }
};

/* ---------- 音声認識(STT) ---------- */
const SRClass=window.SpeechRecognition||window.webkitSpeechRecognition;
const STT={
  blocked:false,
  kind(){if(ENV.native)return 'native';if(SRClass&&!ENV.artifact)return 'web';return 'none';},
  supported(){return this.kind()!=='none';},
  /* mode: 'sentence'=1文を採点 / 'free'=自由発話(長め・沈黙で自動終了) */
  start(o){
    const k=this.kind();
    if(k==='native')return this._native(o);
    if(k==='web')return this._web(o);
    o.onError&&o.onError('unsupported');o.onEnd&&o.onEnd(false);
    return {stop(){},abort(){}};
  },
  _native(o){
    let got=false;
    const id=Native.call('stt.start',{mode:o.mode||'sentence',lang:'en-US'},ev=>{
      if(ev.type==='level'&&o.onLevel)o.onLevel(ev.v);
      else if(ev.type==='partial'&&o.onInterim)o.onInterim(ev.text||'');
      else if(ev.type==='result'){const alts=(ev.alts||[]).filter(Boolean);if(alts.length){got=true;o.onResult&&o.onResult(alts[0],alts);}}
      else if(ev.type==='error'){o.onError&&o.onError(ev.error||'error');}
      else if(ev.type==='end'){o.onEnd&&o.onEnd(got);}
    });
    return {stop(){Native.call('stt.stop',{target:id});},abort(){Native.call('stt.abort',{target:id});}};
  },
  _web(o){
    let rec;
    try{rec=new SRClass();}catch(e){o.onError&&o.onError('unsupported');o.onEnd&&o.onEnd(false);return {stop(){},abort(){}};}
    const free=o.mode==='free';
    rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=3;rec.continuous=free;
    const finals=[],finalAlts=[];let heardAny=false,silence=null,maxT=null,ended=false;
    rec.onresult=e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i];
        if(r.isFinal){finals.push(r[0].transcript.trim());finalAlts.push(Array.from(r).map(a=>a.transcript.trim()));}
        else interim+=r[0].transcript;
      }
      heardAny=true;
      o.onInterim&&o.onInterim((finals.join(' ')+' '+interim).trim());
      o.onLevel&&o.onLevel(0.55+Math.random()*0.45);
      if(free){clearTimeout(silence);silence=setTimeout(()=>{try{rec.stop();}catch(e){}},2300);}
    };
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')STT.blocked=true;
      if(e.error!=='aborted')o.onError&&o.onError(e.error);};
    rec.onend=()=>{
      if(ended)return;ended=true;clearTimeout(silence);clearTimeout(maxT);
      if(finals.length){
        const best=finals.join(' ').replace(/\s+/g,' ').trim();
        const head=finals.slice(0,-1).join(' ');
        const alts=[best].concat((finalAlts[finalAlts.length-1]||[]).slice(1).map(a=>(head+' '+a).trim()));
        o.onResult&&o.onResult(best,alts);
      }
      o.onEnd&&o.onEnd(finals.length>0);
    };
    try{rec.start();}catch(e){o.onError&&o.onError('start_failed');o.onEnd&&o.onEnd(false);ended=true;}
    maxT=setTimeout(()=>{try{rec.stop();}catch(e){}},free?60000:15000);
    return {stop(){try{rec.stop();}catch(e){}},abort(){try{rec.abort();}catch(e){}}};
  }
};

/* ---------- 採点:表記ゆれを吸収してから単語単位で照合 ---------- */
const CONTRACTIONS={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","it's":"it is","that's":"that is",
  "what's":"what is","there's":"there is","here's":"here is","he's":"he is","she's":"she is","who's":"who is","where's":"where is",
  "how's":"how is","let's":"let us","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will",
  "you'll":"you will","we'll":"we will","they'll":"they will","it'll":"it will","he'll":"he will","she'll":"she will","that'll":"that will",
  "i'd":"i would","you'd":"you would","we'd":"we would","they'd":"they would","he'd":"he would","she'd":"she would",
  "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","don't":"do not","doesn't":"does not","didn't":"did not",
  "haven't":"have not","hasn't":"has not","hadn't":"had not","won't":"will not","wouldn't":"would not","can't":"can not","cannot":"can not",
  "couldn't":"could not","shouldn't":"should not","mustn't":"must not","there'll":"there will","what'll":"what will","y'all":"you all"};
const SYN={ok:'okay',dr:'doctor',ekg:'ecg',mr:'mister',mrs:'missus',ms:'miz',percent:'percent',pct:'percent',
  colour:'color',favourite:'favorite',centre:'center',analyse:'analyze',programme:'program',haemoglobin:'hemoglobin',oesophagus:'esophagus',
  anaemia:'anemia',paediatric:'pediatric',tumour:'tumor',behaviour:'behavior',randomised:'randomized',hospitalised:'hospitalized',
  organisation:'organization',realise:'realize',recognise:'recognize',apologise:'apologize',gonna:'going to',wanna:'want to',gotta:'got to',
  alright:'all right',everyday:'every day',anytime:'any time'};
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,
  fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
const TENW={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const ORDW={first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,eleventh:11,twelfth:12,thirteenth:13,
  fourteenth:14,fifteenth:15,sixteenth:16,seventeenth:17,eighteenth:18,nineteenth:19,twentieth:20,thirtieth:30,fortieth:40,fiftieth:50};
function ordSuffix(n){const t=n%100;if(t>=11&&t<=13)return n+'th';return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th');}
/* 文字列 → [{t:語, src:[元の単語番号]}] */
function canonTokens(text){
  let s=String(text||'').replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"');
  s=s.replace(/(\d),(?=\d{3})/g,'$1').replace(/(\d)\s*%/g,'$1 percent').replace(/(\d)\s*°\s*[cf]?/gi,'$1 degrees')
     .replace(/\$(\d+(?:\.\d+)?)/g,'$1 dollars').replace(/(\d):(\d\d)/g,'$1 $2').replace(/\b([ap])\.\s?m\./gi,'$1m')
     .replace(/\s+and a half\b/gi,' point five');
  const words=s.split(/\s+/).filter(Boolean);
  let items=[];
  words.forEach((w,wi)=>{
    let x=w.toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9'.]+$/g,'').replace(/\.$/,'');
    x=x.replace(/[^a-z0-9'.\-]/g,'');
    if(!x)return;
    x.split('-').forEach(part=>{
      if(!part)return;
      part=part.replace(/^'+|'+$/g,'');
      if(!part)return;
      const exp=CONTRACTIONS[part];
      if(exp){exp.split(' ').forEach(t=>items.push({t,src:[wi]}));return;}
      if(/'s$/.test(part))part=part.slice(0,-2);
      part=part.replace(/'/g,'');
      if(/^\d+\.\d+$/.test(part)){items.push({t:part,src:[wi]});return;}
      part=part.replace(/\./g,'');
      if(!part)return;
      if(SYN[part]){SYN[part].split(' ').forEach(t=>items.push({t,src:[wi]}));return;}
      const od=part.match(/^(\d+)(st|nd|rd|th)$/);
      if(od){items.push({t:ordSuffix(+od[1]),src:[wi]});return;}
      items.push({t:part,src:[wi]});
    });
  });
  items=parseNumberWords(items);
  /* 隣り合う数字は連結(0 9 0 → 090、19 58 → 1958)、「38 point 5」→ 38.5 */
  const out=[];
  items.forEach(it=>{
    const prev=out[out.length-1],prev2=out[out.length-2];
    if(prev&&prev2&&prev.t==='point'&&/^\d+$/.test(prev2.t)&&/^\d+$/.test(it.t)){
      out.pop();prev2.t+='.'+it.t;prev2.src=prev2.src.concat(prev.src,it.src);return;}
    if(prev&&/^\d+$/.test(prev.t)&&/^\d+$/.test(it.t)){prev.t+=it.t;prev.src=prev.src.concat(it.src);}
    else out.push({t:it.t,src:it.src.slice()});
  });
  return out;
}
function parseNumberWords(items){
  const out=[];let i=0;
  const isCard=t=>(t in NUMW)||(t in TENW);
  while(i<items.length){
    const t=items[i].t;
    if(t in ORDW){out.push({t:ordSuffix(ORDW[t]),src:items[i].src});i++;continue;}
    if((t in TENW)&&i+1<items.length&&(items[i+1].t in ORDW)&&ORDW[items[i+1].t]<10){
      out.push({t:ordSuffix(TENW[t]+ORDW[items[i+1].t]),src:items[i].src.concat(items[i+1].src)});i+=2;continue;}
    if(!isCard(t)){out.push(items[i]);i++;continue;}
    /* 基数を1つ読み取る("nineteen fifty" のように続かない語で区切る) */
    let total=0,cur=0,last='',j=i,src=[];
    while(j<items.length){
      const w=items[j].t;
      if(w in NUMW){
        const v=NUMW[w];
        if(last==='ones'||last==='teens')break;
        if(last==='tens'&&(v>=10||v===0))break;
        cur+=v;last=v>=10?'teens':'ones';
      }else if(w in TENW){
        if(last==='ones'||last==='teens'||last==='tens')break;
        cur+=TENW[w];last='tens';
      }else if(w==='hundred'){
        if(last==='hundred')break;
        cur=(cur||1)*100;last='hundred';
      }else if(w==='thousand'){
        if(last==='thousand')break;
        total+=(cur||1)*1000;cur=0;last='thousand';
      }else if(w==='and'&&(last==='hundred'||last==='thousand')&&j+1<items.length&&isCard(items[j+1].t)){
        src=src.concat(items[j].src);j++;continue;
      }else break;
      src=src.concat(items[j].src);j++;
    }
    const val=String(total+cur);
    if(j+1<items.length&&items[j].t==='point'&&(items[j+1].t in NUMW)&&NUMW[items[j+1].t]<10){
      let dec='';src=src.concat(items[j].src);j++;
      while(j<items.length&&(items[j].t in NUMW)&&NUMW[items[j].t]<10){dec+=NUMW[items[j].t];src=src.concat(items[j].src);j++;}
      out.push({t:val+'.'+dec,src});i=j;continue;
    }
    out.push({t:val,src});i=j;
  }
  return out;
}
function stem(w){return w.replace(/(ies|es|s|ed|ing|ly)$/,'');}
function charSim(a,b){
  if(a===b)return 1;const m=a.length,n=b.length;if(!m||!n)return 0;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return 1-prev[n]/Math.max(m,n);
}
function tokSim(a,b){
  if(a==='*')return 1;
  if(a===b)return 1;
  if(a.length>3&&b.length>3&&stem(a)===stem(b))return .8;
  if(a.length>=4&&b.length>=4&&charSim(a,b)>=.75)return .5;
  return 0;
}
/* 複合語のゆれ(wifi ↔ wi fi、hemi colectomy ↔ hemicolectomy)を目標文に合わせる */
function fixCompounds(H,T,tset){
  const out=[];
  for(let j=0;j<H.length;j++){
    const h=H[j];
    if(!tset.has(h)){
      let split=false;
      for(let i=0;i+1<T.length;i++){if(T[i].t+T[i+1].t===h){out.push(T[i].t,T[i+1].t);split=true;break;}}
      if(split)continue;
      if(j+1<H.length&&tset.has(h+H[j+1])&&!tset.has(H[j+1])){out.push(h+H[j+1]);j++;continue;}
    }
    out.push(h);
  }
  return out;
}
/* 目標文 vs 認識結果 → {score, words:[{w,st}], heard} */
function scoreSpeech(target,alts){
  const name=(S.settings.enName||'').trim().toLowerCase();
  const disp=String(target).split(/\s+/).filter(Boolean);
  const T=canonTokens(target).map(x=>Object.assign({},x));
  if(name)T.forEach(x=>{if(x.t===name.replace(/[^a-z0-9]/g,''))x.t='*';});
  let best=null;
  const tset=new Set(T.map(x=>x.t));
  (alts&&alts.length?alts:['']).forEach(alt=>{
    const H=fixCompounds(canonTokens(alt).map(x=>x.t),T,tset);
    const m=T.length,n=H.length;
    const D=Array.from({length:m+1},()=>new Float64Array(n+1));
    const B=Array.from({length:m+1},()=>new Uint8Array(n+1));
    for(let i=1;i<=m;i++){D[i][0]=D[i-1][0]+(T[i-1].t==='*'?0:1);B[i][0]=1;}
    for(let j=1;j<=n;j++){D[0][j]=j*.5;B[0][j]=2;}
    for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
      const del=D[i-1][j]+(T[i-1].t==='*'?0:1),ins=D[i][j-1]+.5,sub=D[i-1][j-1]+(1-tokSim(T[i-1].t,H[j-1]));
      if(sub<=del&&sub<=ins){D[i][j]=sub;B[i][j]=0;}else if(del<=ins){D[i][j]=del;B[i][j]=1;}else{D[i][j]=ins;B[i][j]=2;}
    }
    const sims=new Array(m).fill(0);let extra=0,i=m,j=n;
    while(i>0||j>0){
      const b=(i>0&&j>0)?B[i][j]:(i>0?1:2);
      if(b===0){sims[i-1]=tokSim(T[i-1].t,H[j-1]);i--;j--;}
      else if(b===1){sims[i-1]=T[i-1].t==='*'?1:0;i--;}
      else{extra++;j--;}
    }
    const sum=sims.reduce((a,x)=>a+x,0);
    const sc=m?clamp(Math.round(sum/(m+extra*.5)*100),0,100):0;
    if(!best||sc>best.score)best={score:sc,sims,heard:alt};
  });
  /* 表示用:元の単語ごとに判定 */
  const wordSt=disp.map(()=>null);
  T.forEach((x,k)=>{const s=best.sims[k];x.src.forEach(wi=>{const prev=wordSt[wi];const v=s>=.99?2:s>=.5?1:0;wordSt[wi]=prev==null?v:Math.min(prev,v);});});
  const words=disp.map((w,i)=>({w,st:wordSt[i]==null?'ok':['miss','near','ok'][wordSt[i]]}));
  return {score:best.score,words,heard:best.heard};
}
function scoreClass(s){return s>=80?'good':s>=60?'mid':'bad';}
function scoreMsg(s){return s>=95?'Perfect!':s>=85?'Excellent!':s>=70?'Great job!':s>=60?'Good — あと少し':'もう一度チャレンジ';}

  return new Promise(res=>{

    const acts=(o.actions||[{label:'OK',value:true}]).map((a,i)=>

/* ---------- 心電図風の音声トレース ---------- */
class Trace{
  constructor(canvas){this.c=canvas;this.ctx=canvas.getContext('2d');this.energy=0;this.run=false;this.ph=0;this.fit();this.idle();}
  fit(){const dpr=window.devicePixelRatio||1;const w=Math.max(120,this.c.clientWidth||320),h=this.c.clientHeight||54;
    this.c.width=Math.round(w*dpr);this.c.height=Math.round(h*dpr);this.w=w;this.h=h;this.dpr=dpr;
    this.buf=new Array(Math.ceil(w/2)+1).fill(0);
    const cs=getComputedStyle(this.c);this.col=(cs.getPropertyValue('--accent')||'#0B7A6F').trim();this.faint=(cs.getPropertyValue('--ink-3')||'#888').trim();}
  bump(v){this.energy=Math.max(this.energy,clamp(v||0,0,1));}
  start(){if(this.run)return;this.fit();this.run=true;const loop=()=>{if(!this.run)return;this.step();this.draw(this.col,2);requestAnimationFrame(loop);};loop();}
  stop(){this.run=false;this.energy=0;this.buf.fill(0);this.idle();}
  step(){
    for(let k=0;k<2;k++){
      this.ph++;const b=this.ph%64,e=this.energy,amp=.16+e*.84;
      let y=(Math.random()-.5)*.05*(.3+e*2);
      if(b>=5&&b<11)y+=Math.sin((b-5)/6*Math.PI)*.12*amp;
      if(b===15)y-=.14*amp;if(b===16)y+=1*amp;if(b===17)y-=.34*amp;
      if(b>=25&&b<37)y+=Math.sin((b-25)/12*Math.PI)*.22*amp;
      this.buf.push(y);this.buf.shift();
    }
    this.energy*=.965;
  }
  draw(col,lw){const {ctx,w,h,dpr}=this;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    const mid=h*.6;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.strokeStyle=col;ctx.beginPath();
    this.buf.forEach((v,i)=>{const x=i*2,y=mid-v*h*.44;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
    if(this.run){const n=this.buf.length-1;ctx.fillStyle=col;ctx.beginPath();ctx.arc(n*2,mid-this.buf[n]*h*.44,3.2,0,7);ctx.fill();}}
  idle(){this.draw(this.faint,1.4);}
}

/* ---------- 発話入力ボックス(マイク/キーボードを自動で切り替え) ---------- */
function dictationTip(){
  if(ENV.isIOS)return 'キーボードの<b>マイクボタン</b>を押すと音声入力できます(話す練習になります)';
  if(ENV.isAndroid)return 'キーボードの<b>マイクボタン</b>で音声入力できます(話す練習になります)';
  if(ENV.isMac)return 'Macは<b>fn(🌐)キーを2回</b>押すと音声入力できます(話す練習になります)';
  return 'Windowsは<b>Windowsキー+H</b>で音声入力できます(話す練習になります)';
}
function SpeakBox(host,opt){
  opt=opt||{};
  const box=document.createElement('div');box.className='speak';host.appendChild(box);
  let mode=inputMode(),rec=null,listening=false,trace=null,disabled=false,destroyed=false;
  const hintIdle=opt.hint||(opt.mode==='free'?'タップして話す(話し終えたら自動で送信)':'タップして英語で話す');
  function render(){
    if(trace){trace.stop();trace=null;}
    if(mode==='voice'){
      box.innerHTML=`<canvas class="trace"></canvas><div class="interim"></div>
        <button class="mic" type="button" aria-label="マイク">${icon('mic')}</button>
        <div class="speak-hint">${esc(hintIdle)}</div>
        ${opt.noSwitch?'':`<button class="linkbtn" type="button" data-sb="text">${icon('keyboard','sm')}キーボードで入力</button>`}`;
      trace=new Trace(box.querySelector('canvas'));
      box.querySelector('.mic').onclick=()=>listening?stop():start();
    }else{
      box.innerHTML=`<div class="typebox"><textarea class="input" rows="1" placeholder="${esc(opt.placeholder||'英語で答える…')}" autocapitalize="sentences" spellcheck="false"></textarea>
        <button class="btn" type="button" aria-label="送信">${icon('send')}</button></div>
        <div class="kbd-tip">${dictationTip()}</div>
        ${STT.supported()&&!opt.noSwitch?`<button class="linkbtn" type="button" data-sb="voice">${icon('mic','sm')}マイクで話す</button>`:''}`;
      const ta=box.querySelector('textarea'),send=box.querySelector('.btn');
      const submit=()=>{const v=ta.value.trim();if(!v||disabled)return;ta.value='';autosize();markActive();opt.onText&&opt.onText(v,[v],'text');};
      const autosize=()=>{ta.style.height='auto';ta.style.height=Math.min(150,ta.scrollHeight+2)+'px';};
      ta.addEventListener('input',autosize);
      ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();}});
      send.onclick=submit;
      if(opt.focus!==false&&!('ontouchstart' in window))setTimeout(()=>{if(!destroyed)ta.focus();},60);
    }
    const sw=box.querySelector('[data-sb]');
    if(sw)sw.onclick=()=>{abort();mode=sw.dataset.sb;render();};
    setDisabled(disabled);
  }
  function setHint(t){const h=box.querySelector('.speak-hint');if(h)h.textContent=t;}
  function start(){
    if(mode!=='voice'||listening||disabled||destroyed)return;
    TTS.stop();
    listening=true;markActive();
    const mic=box.querySelector('.mic'),interim=box.querySelector('.interim');
    mic.classList.add('on');mic.innerHTML=icon(opt.mode==='free'?'send':'stop');
    setHint(opt.mode==='free'?'聞いています… もう一度押すと送信':'聞いています… 英語でどうぞ');
    interim.textContent='';
    if(trace)trace.start();
    opt.onStart&&opt.onStart();
    rec=STT.start({mode:opt.mode||'sentence',
      onInterim:t=>{interim.textContent=t;if(trace)trace.bump(.7);},
      onLevel:v=>{if(trace)trace.bump(v);},
      onResult:(best,alts)=>{interim.textContent='';opt.onText&&opt.onText(best,alts,'voice');},
      onError:err=>{
        if(err==='no-speech'){setHint(STT_ERR['no-speech']);return;}
        const msg=STT_ERR[err]||('音声認識エラー: '+err);
        setHint(msg);
        if(err==='not-allowed'||err==='service-not-allowed'||err==='unsupported'){
          if(ENV.native)toast(msg,'',5200);
          else{mode='text';setTimeout(()=>{if(!destroyed){render();toast('キーボード入力に切り替えました');}},900);}
        }
      },
      onEnd:got=>{
        listening=false;rec=null;
        if(destroyed)return;
        if(trace)trace.stop();
        const m=box.querySelector('.mic');if(m){m.classList.remove('on');m.innerHTML=icon('mic');}
        if(!got&&box.querySelector('.speak-hint').textContent.startsWith('聞いています'))setHint('聞き取れませんでした。もう一度どうぞ');
        else if(got)setHint(hintIdle);
        opt.onEnd&&opt.onEnd(got);
      }});
  }
  function stop(){if(rec)rec.stop();}
  function abort(){if(rec){rec.abort();rec=null;}listening=false;if(trace)trace.stop();}
  function setDisabled(b){disabled=b;box.querySelectorAll('button,textarea').forEach(x=>{if(!x.dataset.sb)x.disabled=b;});}
  function destroy(){destroyed=true;abort();box.remove();}
  render();
  if(opt.autoStart&&mode==='voice')setTimeout(start,80);
  return {start,stop,abort,destroy,setDisabled,setHint,get listening(){return listening;},get mode(){return mode;},el:box};
}

/* ---------- ファイル保存(Macアプリ / claude.ai / ブラウザで方式を切り替え) ---------- */
const Cap={sample:null,downloads:null,checked:false,
  init(){
    if(!ENV.artifact){this.checked=true;return;}
    try{window.claude.use('sample').then(f=>{this.sample=f||null;this.checked=true;App.onCaps();}).catch(()=>{this.checked=true;App.onCaps();});}catch(e){this.checked=true;}
    try{window.claude.use('downloads').then(d=>{this.downloads=d||null;App.onCaps();}).catch(()=>{});}catch(e){}
  }};
function blobToBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob);});}
async function saveFile(filename,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  if(ENV.native){
    const b64=await blobToBase64(blob);
    return new Promise((res,rej)=>{Native.call('file.save',{filename,b64},ev=>{
      if(ev.type==='done'){ev.ok?res('saved'):rej(ev.error||'cancelled');}});});
  }
  if(ENV.artifact){
    if(!Cap.downloads)throw 'unavailable';
    const r=await Cap.downloads.save({filename,data:blob});
    return r.status;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  return 'saved';
}
function canSaveFiles(){return ENV.native||!ENV.artifact||!!Cap.downloads;}

/* ---------- 90日カリキュラム(練習タブ内の画面) ---------- */
function renderCurriculum(el){
  const weeks=[];
  for(let w=0;w<13;w++){
    const start=w*7+1;if(start>90)break;
    const cells=[];
    for(let i=0;i<7;i++){const d=start+i;if(d>90)break;
      const c=CURRICULUM[d-1];const done=S.daysDone[d];
      cells.push(`<button class="day${done?' done':''}${d===S.curDay?' cur':''}" type="button" data-day="${d}" title="${esc(SCENARIOS.find(s=>s.id===c.scenario).title)}">${d}<small>${done?'済':MODE_LABEL[c.mode].slice(0,2)}</small></button>`);}
    const c0=CURRICULUM[start-1];
    weeks.push(`<div class="week"><div class="wh"><span style="color:var(--${c0.cat})">第${w+1}週</span><span class="faint">${esc(c0.catLabel)}</span></div><div class="days">${cells.join('')}</div></div>`);
  }
  el.innerHTML=`${backbar('練習メニュー','home')}
    ${vh('90日カリキュラム',`完了 ${Object.keys(S.daysDone).length}/90日 ・ 日付を押すとその日の会話へ`)}
    <div class="card"><p class="small muted">1〜30日は日常会話、31〜60日は医療英語、61〜90日は研究・学会英語。各シナリオを「台本あり → 日本語だけ見て → 音声だけで」の順で繰り返し、補助を少しずつ外して定着させます。</p></div>
    <div class="weeks mt">${weeks.join('')}</div>`;
  el.onclick=async e=>{
    const b=e.target.closest('[data-act]');if(b&&b.dataset.act==='home'){PracticeView.open('home');return;}
    const d=e.target.closest('[data-day]');if(!d)return;
    const n=+d.dataset.day,c=CURRICULUM[n-1];
    const v=await dialog({title:`Day ${n}`,body:`${SCENARIOS.find(s=>s.id===c.scenario).title}(${MODE_LABEL[c.mode]})`,cancelValue:null,
      actions:[{label:'閉じる',value:null,kind:'ghost'},{label:'この日を「今日」にする',value:'set',kind:'ghost'},{label:'会話を始める',value:'go'}]});
    if(v==='set'){S.curDay=n;const D=dayState();D.dayNo=n;D.done=false;save();toast(`Day ${n} を今日の処方にしました`);renderCurriculum(el);}
    if(v==='go')PracticeView.open('role',{id:c.scenario,mode:c.mode});
  };
}

/* 読み上げが終わるまで待つ(万一イベントが来なくても先に進む) */
function speakWait(text,opt){
  const words=String(text).split(/\s+/).length;
  const est=words*430/((opt&&opt.rate)||S.settings.rate||1)+2500;
  return Promise.race([TTS.speak(text,opt),sleep(est)]);
}

/* ---------- ロールプレイ本体 ---------- */
PS.role=(el,p)=>{
  const sc=SCENARIOS.find(s=>s.id===p.id)||SCENARIOS[0];
  let mode=p.mode||'guided',idx=0,uIdx=0,results=[],box=null,alive=true,timers=[],busy=false;
  const T=sc.turns.map(t=>({who:t.who,en:withName(t.en),ja:withName(t.ja)}));
  const nUser=T.filter(t=>t.who==='user').length;
  el.innerHTML=`${backbar('ロールプレイ一覧','list')}
    <div class="vh"><div class="grow"><div class="row" style="flex-wrap:nowrap">${tile(sc.cat,scCode(sc.id))}<div class="grow"><h1 style="font-size:20px">${esc(sc.title)}</h1><div class="sub">${esc(sc.desc)}</div></div></div></div><span class="progress-dots" id="rpProg"></span></div>
    ${segHtml('rmode',[['guided','台本あり'],['recall','日本語だけ'],['free','音声だけ']],mode)}
    <div class="chat mt" id="rpLog"></div>
    <div id="rpTurn"></div>`;
  const log=$('#rpLog',el),turnEl=$('#rpTurn',el),prog=$('#rpProg',el);
  const clearBox=()=>{if(box){box.destroy();box=null;}};
  async function next(){
    clearBox();turnEl.innerHTML='';
    while(alive&&idx<T.length&&T[idx].who==='ai'){
      const t=T[idx];
      log.insertAdjacentHTML('beforeend',bubbleHtml('ai',t.en,t.ja));scrollEnd(log.lastElementChild);
      idx++;
      if(S.settings.autoSpeak){turnEl.innerHTML=`<div class="center faint small mt">${icon('speaker','sm')} 相手が話しています…</div>`;await speakWait(t.en);}
      else await sleep(250);
      if(!alive)return;
    }
    turnEl.innerHTML='';
    if(idx>=T.length){finish();return;}
    userTurn();
  }
  function userTurn(){
    const t=T[idx];
    prog.textContent=`${uIdx+1} / ${nUser}`;
    const lead=mode==='guided'?'あなたのセリフ ・ 声に出して読みましょう':mode==='recall'?'この意味を英語で言ってください':'相手に自然に答えてください(タップで英文を表示)';
    turnEl.innerHTML=`<div class="prompt-card mt"><div class="lead">${lead}</div>
      ${mode==='recall'?`<div class="target ja-prompt">${esc(t.ja)}</div><div class="target-ja" id="rpModel" hidden></div>`
        :`<div class="target${mode==='free'?' blur':''}" id="rpTarget">${esc(t.en)}</div>${mode==='guided'&&S.settings.showJa?`<div class="target-ja">${esc(t.ja)}</div>`:''}`}
      <div class="tools">${sayBtns(t.en)}<button class="btn quiet sm" type="button" data-act="skip">スキップ${icon('chev','sm')}</button></div></div>
      <div id="rpBox"></div><div class="result" id="rpRes"></div>`;
    const tg=$('#rpTarget',turnEl);if(tg&&mode==='free')tg.onclick=()=>tg.classList.remove('blur');
    box=SpeakBox($('#rpBox',turnEl),{mode:'sentence',onText:(best,alts,via)=>judge(t,best,alts,via)});
    scrollEnd(turnEl);
  }
  function judge(t,best,alts,via){
    if(busy)return;
    const res=scoreSpeech(t.en,alts);
    const pass=mode==='guided'?60:50;
    logAttempt(res.score,sc.cat,t.en,t.ja,'role');
    results[uIdx]=Math.max(results[uIdx]||0,res.score);
    const tg=$('#rpTarget',turnEl);if(tg){tg.innerHTML=wordsHtml(res.words);tg.classList.remove('blur');}
    const md=$('#rpModel',turnEl);if(md){md.hidden=false;md.innerHTML=`お手本:<span class="en">${wordsHtml(res.words)}</span>`;}
    $('#rpRes',turnEl).innerHTML=readoutHtml(res,{via})+(res.score<pass?`<div class="row center mt"><button class="btn ghost sm" type="button" data-act="accept">このまま次へ</button></div>`:'');
    if(res.score>=pass)advance(best,res.score);
  }
  function advance(said,score){
    busy=true;if(box)box.setDisabled(true);
    log.insertAdjacentHTML('beforeend',bubbleHtml('me',said,'',{after:score!=null?`<span class="score" style="color:var(--${scoreClass(score)==='good'?'good':scoreClass(score)==='mid'?'warn':'bad'})">${score}%</span>`:''}));
    timers.push(setTimeout(()=>{busy=false;idx++;uIdx++;if(alive)next();},score!=null?1000:250));
  }
  function finish(){
    prog.textContent=`${nUser} / ${nUser}`;
    const got=results.filter(x=>x!=null);
    const avg=got.length?Math.round(got.reduce((a,x)=>a+x,0)/nUser):0;
    const r=S.roles[sc.id]||(S.roles[sc.id]={});
    const prevBest=r[mode]||0;r[mode]=Math.max(prevBest,avg);
    bumpTask('talk');addXP(10);touchStudy();save();
    const nextMode={guided:'recall',recall:'free'}[mode];
    turnEl.innerHTML=`<div class="card mt">
      <div class="card-head"><div class="grow"><div class="eyebrow">会話完了</div><h2>${esc(sc.title)} ・ ${MODE_LABEL[mode]}</h2></div></div>
      <div class="readout ${scoreClass(avg)}"><div><div class="lab">AVERAGE</div><div class="val num">${avg}<small>%</small></div></div>
        <div class="grow"><div class="msg">${avg>prevBest&&prevBest?'自己ベスト更新!':esc(scoreMsg(avg))}</div><div class="heard">${nextMode?`次は「${MODE_LABEL[nextMode]}」で補助を外してみましょう`:'3段階すべて完了。AI会話で応用してみましょう'}</div></div></div>
      <div class="row mt">
        <button class="btn ghost" type="button" data-act="again">${icon('refresh')}もう一度</button>
        ${nextMode?`<button class="btn" type="button" data-act="mode-${nextMode}">「${MODE_LABEL[nextMode]}」へ</button>`:''}
        <button class="btn ghost" type="button" data-act="ai">${icon('ai')}この場面をAIと話す</button>
      </div></div>`;
    scrollEnd(turnEl);
  }
  function restart(){alive=true;timers.forEach(clearTimeout);timers=[];busy=false;TTS.stop();idx=0;uIdx=0;results=[];log.innerHTML='';next();}
  el.onclick=e=>{
    const sg=e.target.closest('[data-seg] button');
    if(sg){$$('[data-seg] button',el).forEach(x=>x.classList.toggle('on',x===sg));mode=sg.dataset.v;restart();return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='list')PracticeView.open('roles');
    else if(a==='skip'){if(busy)return;TTS.stop();advance(T[idx].en,null);}
    else if(a==='accept'){if(busy)return;advance(T[idx].en,results[uIdx]);}
    else if(a==='again')restart();
    else if(a.startsWith('mode-')){mode=a.slice(5);$$('[data-seg] button',el).forEach(x=>x.classList.toggle('on',x.dataset.v===mode));restart();window.scrollTo(0,0);}
    else if(a==='ai')App.go('ai',{start:'custom',custom:`「${sc.title}」の場面(${sc.desc})。あなた(AI)は台本で相手役だった人物を演じ、学習者と自由に会話を続けてください。台本の最初のセリフ: "${T[0].en}"`});
  };
  next();
  return ()=>{alive=false;timers.forEach(clearTimeout);clearBox();};
};

        <span class="tiny faint">85%以上で自動的に次へ</span>
        <button class="btn sm" type="button" data-act="next">次へ${icon('chev','sm')}</button></div>`;
    box=SpeakBox($('#shBox',el),{mode:'sentence',onText:(best,alts,via)=>{
      const res=scoreSpeech(s.en,alts);
      $('#shT',el).innerHTML=wordsHtml(res.words);
      $('#shRes',el).innerHTML=readoutHtml(res,{via});
      logAttempt(res.score,s.cat,s.en,s.ja,'shadow');
      const key=todayStr()+'|'+s.en;
      if(res.score>=60&&!SH_COUNTED.has(key)){SH_COUNTED.add(key);bumpTask('shadow');}
      if(res.score>=85)timers.push(setTimeout(()=>{SH_IDX=(SH_IDX+1)%list.length;draw(true);},1700));
    }});
    if(autoplay&&S.settings.autoSpeak)timers.push(setTimeout(()=>TTS.speak(s.en),250));
  };
  draw(false);
  el.onclick=e=>{
    const sg=e.target.closest('[data-seg] button');if(sg){SH_CAT=sg.dataset.v;SH_IDX=0;draw(true);return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    timers.forEach(clearTimeout);timers=[];
    if(b.dataset.act==='home')PracticeView.open('home');
    if(b.dataset.act==='prev'){SH_IDX=(SH_IDX-1+list.length)%list.length;draw(true);}
    if(b.dataset.act==='next'){SH_IDX=(SH_IDX+1)%list.length;draw(true);}
  };
  return ()=>{timers.forEach(clearTimeout);if(box)box.destroy();};
};

    const btn=$('[data-act="check"]',el);if(btn)btn.textContent=k+1<N?'次の問題':'結果を見る';
  };
  const nextQ=()=>{k++;if(k>=N)summary();else q();};
  const summary=()=>{
    const avg=Math.round(results.reduce((a,r)=>a+r.score,0)/results.length);
    addXP(8);touchStudy();save();
    el.innerHTML=`${backbar('練習メニュー','home')}
      <div class="card"><div class="eyebrow">結果</div>
      <div class="readout ${scoreClass(avg)} mt-s"><div><div class="lab">AVERAGE</div><div class="val num">${avg}<small>%</small></div></div><div class="grow"><div class="msg">${esc(scoreMsg(avg))}</div><div class="heard">正確に聞き取れた語の割合です</div></div></div>
      <div class="mt">${results.map(r=>`<div class="res-row"><div class="grow"><div class="en">${esc(r.en)}</div><div class="ja">${esc(r.ja)}</div></div><span class="pct" style="color:var(--${r.score>=80?'good':r.score>=60?'warn':'bad'})">${r.score}%</span></div>`).join('')}</div>
      <div class="row mt"><button class="btn" type="button" data-act="start">もう一度</button><button class="btn ghost" type="button" data-act="setup">設定に戻る</button></div></div>`;
  };

    const sg=e.target.closest('[data-seg] button');if(sg){cat=sg.dataset.v;$$('[data-seg] button',el).forEach(x=>x.classList.toggle('on',x===sg));return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;

    else if(a==='setup'){TTS.stop();setup();}
    else if(a==='start'){items=shuffle(SHADOW.filter(s=>cat==='all'||s.cat===cat)).slice(0,N);k=0;results=[];q();}
    else if(a==='check')check();
  };
  return ()=>timers.forEach(clearTimeout);
};
