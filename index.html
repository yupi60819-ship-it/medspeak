/* 制限時間つきの出題(時間切れでマイクが自動起動。キーボード時は入力済みの内容で判定) */
function timedQuestion(host,it,secs,cb){
  host.innerHTML=`<div class="big-ja">${esc(it.ja)}</div>
    <div class="countdown" data-cd>${secs.toFixed(1)}</div>
    <div class="timer" data-tm><i style="width:100%"></i></div>
    <div data-box></div><div class="result" data-res></div>`;
  const cd=host.querySelector('[data-cd]'),tm=host.querySelector('[data-tm]'),bar=tm.firstElementChild;
  let done=false,iv=null,timeUp=false,guard=null;
  const t0=Date.now(),ms=secs*1000;
  const finish=r=>{if(done)return;done=true;clearInterval(iv);clearTimeout(guard);box.setDisabled(true);cd.textContent='';cb(r);};
  const box=SpeakBox(host.querySelector('[data-box]'),{mode:'sentence',hint:'考えずに口から出す!(押して話す)',placeholder:'英語で入力…',
    onText:(best,alts,via)=>{const r=scoreSpeech(it.en,alts);finish({score:r.score,res:r,via,heard:best});},
    onEnd:got=>{if(!got&&timeUp&&!done)finish({score:0,timeout:true});}});
  iv=setInterval(()=>{
    const left=ms-(Date.now()-t0);
    if(left<=0){
      clearInterval(iv);timeUp=true;cd.textContent='いま話して!';bar.style.width='0%';
      if(box.mode==='voice'){if(!box.listening)box.start();guard=setTimeout(()=>{if(!done)finish({score:0,timeout:true});},14000);}
      else{const ta=host.querySelector('textarea');const v=ta&&ta.value.trim();
        if(v){const r=scoreSpeech(it.en,[v]);finish({score:r.score,res:r,via:'text',heard:v});}else finish({score:0,timeout:true});}
      return;
    }
    bar.style.width=(left/ms*100)+'%';tm.classList.toggle('low',left<ms*.3);cd.textContent=(left/1000).toFixed(1);
  },100);
  return {cleanup(){clearInterval(iv);clearTimeout(guard);box.destroy();},pass(){finish({score:0,passed:true});},
    res:host.querySelector('[data-res]')};
}
function timedResultHtml(it,r){
  const head=r.res?readoutHtml(r.res,{via:r.via})
    :`<div class="readout bad"><div><div class="lab">${r.passed?'PASS':'TIME'}</div><div class="val num">0<small>%</small></div></div><div class="grow"><div class="msg">${r.passed?'パスしました':'時間切れ'}</div><div class="heard">正解を聞いて、次は口から出しましょう</div></div></div>`;
  return `${head}<div class="prompt-card mt"><div class="lead">正解</div><div class="target" style="font-size:19px">${r.res?wordsHtml(r.res.words):esc(it.en)}</div></div>`;
}
function flashBank(cat){return shuffle(PHRASES.concat(SHADOW).filter(x=>cat==='all'||x.cat===cat));}

/* ---------- 瞬間英作文 ---------- */
let FL_CAT='all',FL_SECS=5;
PS.flash=el=>{
  const N=8;let items=[],k=0,results=[],cur=null,timers=[];
  const setup=()=>{
    el.innerHTML=`${backbar('練習メニュー','home')}
      ${vh('瞬間英作文','日本語を見て、制限時間内に反射で英語を言う。「考える前に口から出る」回路を作ります')}
      <div class="card stack">
        <div class="field"><span class="lbl">分野</span>${catSeg('fcat',FL_CAT)}</div>
        <div class="field"><span class="lbl">制限時間</span>${segHtml('fsec',[['3','3秒(鬼)'],['5','5秒(標準)'],['8','8秒(じっくり)']],String(FL_SECS))}</div>
        <p class="small muted">全${N}問。${inputMode()==='voice'?'時間切れになると自動でマイクが起動します。':'時間内に入力(音声入力も可)して送信します。'}</p>
        <button class="btn lg block" type="button" data-act="start">${icon('bolt')}スタート</button></div>`;
  };
  const q=()=>{
    const it=items[k];
    el.innerHTML=`${backbar('やめる','setup')}
      <div class="card"><div class="row between"><span class="progress-dots">${k+1} / ${N}</span>${catTag(it.cat)}</div>
      <div data-q></div>
      <div class="row center mt"><button class="btn quiet sm" type="button" data-act="pass">パス${icon('chev','sm')}</button></div></div>`;
    cur=timedQuestion($('[data-q]',el),it,FL_SECS,r=>{
      results.push({en:it.en,ja:it.ja,score:r.score,passed:r.passed});
      logAttempt(r.score,it.cat,it.en,it.ja,'flash');
      cur.res.innerHTML=timedResultHtml(it,r);
      if(!r.res||r.score<80)TTS.speak(it.en);
      const pb=$('[data-act="pass"]',el);if(pb){pb.textContent='次へ';pb.dataset.act='nextq';}
      timers.push(setTimeout(nextQ,r.score>=80?1800:3400));
    });
  };
  const nextQ=()=>{timers.forEach(clearTimeout);timers=[];if(cur){cur.cleanup();cur=null;}k++;if(k>=N)summary();else q();};
  const summary=()=>{
    const avg=Math.round(results.reduce((a,r)=>a+r.score,0)/results.length);
    addXP(6);touchStudy();save();
    el.innerHTML=`${backbar('練習メニュー','home')}
      <div class="card"><div class="eyebrow">結果</div>
      <div class="readout ${scoreClass(avg)} mt-s"><div><div class="lab">AVERAGE</div><div class="val num">${avg}<small>%</small></div></div><div class="grow"><div class="msg">${avg>=80?'反射で言えています!':avg>=60?'あと一歩':'苦手フレーズに自動登録されました'}</div><div class="heard">70%未満の文は「復習 → 苦手フレーズ」で特訓できます</div></div></div>
      <div class="mt">${results.map(r=>`<div class="res-row"><div class="grow"><div class="en">${esc(r.en)}</div><div class="ja">${esc(r.ja)}</div></div><span class="pct" style="color:var(--${r.score>=80?'good':r.score>=60?'warn':'bad'})">${r.passed?'パス':r.score+'%'}</span></div>`).join('')}</div>
      <div class="row mt"><button class="btn" type="button" data-act="start">もう一度</button><button class="btn ghost" type="button" data-act="setup">設定に戻る</button></div></div>`;
  };
  setup();
  el.onclick=e=>{
    const sg=e.target.closest('[data-seg] button');
    if(sg){const id=sg.parentElement.dataset.seg;$$('button',sg.parentElement).forEach(x=>x.classList.toggle('on',x===sg));
      if(id==='fcat')FL_CAT=sg.dataset.v;if(id==='fsec')FL_SECS=+sg.dataset.v;return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='home')PracticeView.open('home');
    else if(a==='setup'){timers.forEach(clearTimeout);if(cur){cur.cleanup();cur=null;}TTS.stop();setup();}
    else if(a==='start'){items=flashBank(FL_CAT).slice(0,N);k=0;results=[];q();}
    else if(a==='pass'){if(cur)cur.pass();}
    else if(a==='nextq')nextQ();
  };
  return ()=>{timers.forEach(clearTimeout);if(cur)cur.cleanup();};
};

/* ---------- 聞き分け道場(ミニマルペア) ---------- */
PS.mp=el=>{
  const N=10;let qs=[],k=0,ok=0,rec=null;
  const report=()=>{
    const keys=Object.keys(S.mp||{}).filter(f=>!/\(発音\)$/.test(f));
    if(!keys.length)return '<p class="small muted">まだデータがありません。テストをすると、苦手な音が分かります。</p>';
    return keys.map(f=>{const m=S.mp[f],tot=m.ok+m.ng,pct=Math.round(m.ok/tot*100);const sp=S.mp[f+'(発音)'];
      return `<div class="catrow" style="grid-template-columns:78px 1fr 88px"><span class="num" style="font-size:12.5px">${esc(f)}</span>
        <div class="track"><i style="width:${pct}%;background:var(--${pct>=80?'good':pct>=60?'warn':'bad'})"></i></div>
        <span class="n">${pct}% (${tot})${sp?`<br>発音 ${Math.round(sp.ok/(sp.ok+sp.ng)*100)}%`:''}</span></div>`;}).join('');
  };
  const home=()=>{
    el.innerHTML=`${backbar('練習メニュー','home')}
      ${vh('聞き分け道場','日本人が苦手な音を「聞き分け → 発音」の順で矯正します')}
      <div class="card"><p class="small muted">再生された単語がどちらかを選びます(全${N}問)。${STT.supported()&&inputMode()==='voice'?'正解後は「発音でも試す」で、自分の発音が正しく認識されるか確認できます。':''}</p>
      <button class="btn lg block mt" type="button" data-act="start">${icon('ear')}テスト開始</button></div>
      <div class="card"><h2>苦手音レポート</h2><div class="mt">${report()}</div></div>`;
  };
  const rec2=(f,good)=>{const m=S.mp[f]||(S.mp[f]={ok:0,ng:0});good?m.ok++:m.ng++;saveSoon();};
  const q=()=>{
    const Q=qs[k];const w=Q.p[Q.t];
    el.innerHTML=`${backbar('やめる','mphome')}
      <div class="card"><div class="row between"><span class="progress-dots">${k+1} / ${N}</span><span class="tag neutral">${esc(Q.p.f)}</span></div>
      <p class="center mt">再生された単語は<b>どっち</b>?</p>
      <div class="row center mt-s"><button class="btn ghost" type="button" data-say="${esc(w)}" data-rate="0.9">${icon('speaker')}もう一度聞く</button></div>
      <div class="pair"><button type="button" data-w="a">${esc(Q.p.a)}</button><button type="button" data-w="b">${esc(Q.p.b)}</button></div>
      <div id="mpFb" class="center"></div></div>`;
    setTimeout(()=>TTS.speak(w,{rate:.9}),250);
  };
  const answer=btn=>{
    const Q=qs[k];if(Q.done)return;Q.done=true;
    const good=btn.dataset.w===Q.t;if(good)ok++;
    btn.classList.add(good?'ok':'ng');
    if(!good)$(`.pair [data-w="${Q.t}"]`,el).classList.add('ok');
    $$('.pair button',el).forEach(x=>x.disabled=true);
    rec2(Q.p.f,good);markActive();addXP(2);touchStudy();
    const canSay=STT.supported()&&inputMode()==='voice';
    $('#mpFb',el).innerHTML=`<p><b style="color:var(--${good?'good':'bad'})">${good?'正解!':'不正解'}</b> 正解は <span class="en"><b>${esc(Q.p[Q.t])}</b></span></p>
      <div class="row center mt">${canSay?`<button class="btn ghost sm" type="button" data-act="say">${icon('mic','sm')}発音でも試す</button>`:''}<button class="btn sm" type="button" data-act="next">次へ${icon('chev','sm')}</button></div><div id="mpSay" class="small mt"></div>`;
  };
  const sayTest=()=>{
    const Q=qs[k],tgt=Q.p[Q.t],oth=Q.p[Q.t==='a'?'b':'a'],out=$('#mpSay',el);
    out.innerHTML=`<span style="color:var(--redpen)">● 聞いています</span> 「<b class="en">${esc(tgt)}</b>」と言ってください`;
    rec=STT.start({mode:'sentence',
      onResult:(best,alts)=>{const all=' '+alts.join(' ').toLowerCase()+' ';
        if(all.includes(' '+tgt+' ')){out.innerHTML=`<b style="color:var(--good)">OK</b> 「${esc(tgt)}」と認識されました`;rec2(Q.p.f+'(発音)',true);}
        else if(all.includes(' '+oth+' ')){out.innerHTML=`<b style="color:var(--bad)">惜しい</b> 「${esc(oth)}」に聞こえています。${esc(Q.p.f)} の違いを意識して`;rec2(Q.p.f+'(発音)',false);}
        else out.innerHTML=`どちらとも判定できませんでした(認識:“${esc(best)}”)`;},
      onError:err=>{out.textContent=STT_ERR[err]||('エラー: '+err);},
      onEnd:got=>{rec=null;if(!got&&out.textContent.includes('聞いています'))out.textContent='聞き取れませんでした。もう一度どうぞ';}});
  };
  const summary=()=>{
    el.innerHTML=`${backbar('道場トップ','mphome')}
      <div class="card center"><div class="eyebrow">結果</div><div class="readout ${scoreClass(ok/N*100)} mt-s" style="justify-content:center"><div class="val num">${ok}<small>/${N}</small></div><div class="msg">${ok>=9?'耳が鍛えられています!':ok>=7?'いい調子':'苦手音を重点的に繰り返しましょう'}</div></div>
      <div class="row center mt"><button class="btn" type="button" data-act="start">もう一度</button></div></div>
      <div class="card"><h2>苦手音レポート</h2><div class="mt">${report()}</div></div>`;
  };
  home();
  el.onclick=e=>{
    const pb=e.target.closest('.pair button');if(pb){answer(pb);return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='home')PracticeView.open('home');
    else if(a==='mphome'){if(rec)rec.abort();home();}
    else if(a==='start'){qs=shuffle(MINPAIRS).slice(0,N).map(p=>({p,t:Math.random()<.5?'a':'b'}));k=0;ok=0;q();}
    else if(a==='say')sayTest();
    else if(a==='next'){if(rec)rec.abort();k++;k>=N?summary():q();}
  };
  return ()=>{if(rec)rec.abort();};
};

/* ---------- 速聴ラダー ---------- */
PS.speed=el=>{
  const STEPS=[1.0,1.2,1.4],N=3;let items=[],k=0,step=0,box=null,timers=[];
  const start=()=>{items=shuffle(SHADOW).slice(0,N);k=0;step=0;q();};
  const q=()=>{
    if(box){box.destroy();box=null;}
    const it=items[k];const r=STEPS[step];
    el.innerHTML=`${backbar('練習メニュー','home')}
      ${vh('速聴ラダー','同じ文を 1.0 → 1.2 → 1.4倍速で聞いて復唱。70%以上で速度アップ')}
      <div class="prompt-card"><div class="row between"><div class="steps">${STEPS.map((s,i)=>`<span class="${i<step?'done':i===step?'now':''}">${s.toFixed(1)}x</span>`).join('')}</div><span class="progress-dots">文 ${k+1}/${N}</span></div>
        <div class="target blur mt" id="spT" title="タップで英文を表示">${esc(it.en)}</div>${S.settings.showJa?`<div class="target-ja">${esc(it.ja)}</div>`:''}
        <div class="tools"><button class="btn sm" type="button" data-say="${esc(it.en)}" data-rate="${r}">${icon('speaker')}${r.toFixed(1)}x で聞く</button>
        <button class="btn quiet sm" type="button" data-act="skip">この文をとばす${icon('chev','sm')}</button></div></div>
      <div id="spBox"></div><div class="result" id="spRes"></div>`;
    const tg=$('#spT',el);tg.onclick=()=>tg.classList.remove('blur');
    box=SpeakBox($('#spBox',el),{mode:'sentence',hint:'聞こえた通りに復唱',onText:(best,alts,via)=>{
      const res=scoreSpeech(it.en,alts);tg.classList.remove('blur');tg.innerHTML=wordsHtml(res.words);
      $('#spRes',el).innerHTML=readoutHtml(res,{via});
      logAttempt(res.score,it.cat,it.en,it.ja,'speed');
      if(res.score>=70){
        const key=todayStr()+'|'+it.en;if(!SH_COUNTED.has(key)){SH_COUNTED.add(key);bumpTask('shadow');}
        step++;if(step>=STEPS.length){step=0;k++;}
        timers.push(setTimeout(()=>k>=N?done():q(),1300));
      }
    }});
    timers.push(setTimeout(()=>TTS.speak(it.en,{rate:r}),300));
  };
  const done=()=>{
    if(box){box.destroy();box=null;}
    addXP(6);touchStudy();save();
    el.innerHTML=`${backbar('練習メニュー','home')}<div class="card center"><div class="eyebrow">完走</div><h2 class="mt-s">1.4倍速まで復唱できました</h2>
      <p class="small muted mt">1.4倍速が聞き取れれば、ネイティブの自然な速さ(音のつながり・脱落を含む)がぐっと楽になります。</p>
      <button class="btn mt" type="button" data-act="again">別の文でもう一度</button></div>`;
  };
  start();
  el.onclick=e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    timers.forEach(clearTimeout);timers=[];
    if(b.dataset.act==='home')PracticeView.open('home');
    if(b.dataset.act==='skip'){step=0;k++;k>=N?done():q();}
    if(b.dataset.act==='again')start();
  };
  return ()=>{timers.forEach(clearTimeout);if(box)box.destroy();};
};

/* ---------- OSCE 模擬医療面接 ---------- */
PS.osce=(el,p)=>{
  let cs=null,covered=new Set(),tLeft=0,iv=null,box=null,alive=true;
  const list=()=>{
    el.innerHTML=`${backbar('練習メニュー','home')}
      ${vh('OSCE 医療面接','あなたは医師。制限時間4分で、患者から必要な情報を英語で聞き出します')}
      <div class="card"><p class="small muted">チェック項目は終了まで非公開です。質問が患者に伝わると答えてくれ、項目が埋まります。終了後に模範質問と想定疾患を確認できます。</p></div>
      <div class="mt">${OSCE_CASES.map(c=>{const b=S.osce[c.id];return `<button class="list-item" type="button" data-case="${c.id}">${tile('medical',icon('steth'))}

  };
  const start=c=>{
    cs=c;covered=new Set();tLeft=c.time;
    el.innerHTML=`${backbar('症例一覧','list')}
      <div class="vh"><div class="grow"><h1>${esc(c.title)}</h1><div class="sub">英語で問診してください</div></div><div class="countdown" id="osT" style="font-size:24px">${Math.floor(tLeft/60)}:${pad2(tLeft%60)}</div></div>

      <details class="mt"><summary class="small muted" style="cursor:pointer">ヒント:聞くべき項目のカテゴリ</summary><p class="small muted mt-s">${c.items.map(i=>esc(i.label)).join(' ・ ')}</p></details>`;
    const log=$('#osLog',el);
    log.insertAdjacentHTML('beforeend',bubbleHtml('ai',c.opening.en,c.opening.ja,{label:'PATIENT'}));
    TTS.speak(c.opening.en);
    box=SpeakBox($('#osBox',el),{mode:'free',placeholder:'英語で質問する…',hint:'タップして質問(話し終えたら自動で送信)',onText:said=>ask(said)});
    iv=setInterval(()=>{tLeft--;const t=$('#osT',el);if(t)t.textContent=`${Math.floor(Math.max(0,tLeft)/60)}:${pad2(Math.max(0,tLeft)%60)}`;if(tLeft<=0)result();},1000);
  };
  const ask=said=>{
    if(!cs)return;
    const log=$('#osLog',el);
    log.insertAdjacentHTML('beforeend',bubbleHtml('me',said,''));
    const t=' '+canonTokens(said).map(x=>x.t).join(' ')+' '+said.toLowerCase()+' ';
    const hits=cs.items.filter(it=>!covered.has(it.label)&&it.re.test(t)).slice(0,2);
    let en,ja;
    if(hits.length){hits.forEach(h=>covered.add(h.label));en=hits.map(h=>h.ans.en).join(' ');ja=hits.map(h=>h.ans.ja).join(' ');
      logAttempt(85,'medical',null,null,'osce');addXP(3*hits.length);}
    else{const g=rand([["Sorry, doctor, could you ask that another way?","すみません先生、別の聞き方をしてもらえますか?"],
        ["I'm not sure what you mean, doctor.","先生、ちょっと意味が分かりません。"],["Hmm... what exactly would you like to know?","うーん…何を知りたいのですか?"]]);en=g[0];ja=g[1];markActive();}
    log.insertAdjacentHTML('beforeend',bubbleHtml('ai',en,ja,{label:'PATIENT'}));
    scrollEnd(log.lastElementChild);
    TTS.speak(en);
    $('#osCov',el).textContent=`聞き出せた項目 ${covered.size} / ${cs.items.length}`;
    if(covered.size>=cs.items.length)setTimeout(()=>{if(alive&&cs)result();},1800);
  };
  const result=()=>{
    if(!cs)return;clearInterval(iv);iv=null;if(box){box.destroy();box=null;}
    const c=cs;cs=null;
    const pct=Math.round(covered.size/c.items.length*100);
    const grade=pct>=90?'A':pct>=70?'B':pct>=50?'C':'D';
    const prev=S.osce[c.id];S.osce[c.id]={best:Math.max(pct,prev?prev.best:0),date:todayStr()};
    touchStudy();addXP(5);save();
    el.innerHTML=`${backbar('症例一覧','list')}
      <div class="card"><div class="eyebrow">判定</div>
        <div class="readout ${scoreClass(pct)} mt-s"><div><div class="lab">GRADE</div><div class="val num">${grade}</div></div><div class="grow"><div class="msg">${covered.size} / ${c.items.length} 項目(${pct}%)</div><div class="heard">想定:<b>${esc(c.dx)}</b></div></div></div>
        <div class="checklist mt">${c.items.map(it=>`<div class="ci ${covered.has(it.label)?'hit':'miss'}"><span class="mark">${covered.has(it.label)?'✓':'×'}</span>
          <div class="grow"><b>${esc(it.label)}</b><div class="en" style="font-size:15px">${esc(it.model)}</div></div>
          <button class="icon-btn" type="button" data-say="${esc(it.model)}" aria-label="読み上げ">${icon('speaker','sm')}</button></div>`).join('')}</div>
        <div class="row mt"><button class="btn" type="button" data-case="${c.id}">もう一度</button><button class="btn ghost" type="button" data-act="list">別の症例</button></div></div>`;
  };
  list();
  el.onclick=e=>{
    const cb=e.target.closest('[data-case]');if(cb){start(OSCE_CASES.find(c=>c.id===cb.dataset.case));return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='home')PracticeView.open('home');
    else if(a==='list'){clearInterval(iv);iv=null;cs=null;if(box){box.destroy();box=null;}TTS.stop();list();}
    else if(a==='finish')result();
  };
  return ()=>{alive=false;clearInterval(iv);if(box)box.destroy();};
};

PS.battle=el=>{
  const ROUNDS=6;let A=null,B=null,items=[],k=0,sc=[0,0],cur=null,timers=[],cat='all';
  const setup=()=>{
    if(META.list.length<2){
      el.innerHTML=`${backbar('練習メニュー','home')}${vh('対戦モード','2人で交互に瞬間英作文。合計スコアで勝負!')}
        <div class="card center"><p class="muted">対戦には2人以上のメンバーが必要です。</p><button class="btn mt" type="button" data-act="members">${icon('users')}メンバーを追加</button></div>`;
      return;
    }
    const opts=META.list.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
    el.innerHTML=`${backbar('練習メニュー','home')}${vh('対戦モード','2人で交互に瞬間英作文(各5秒)。合計スコアで勝負!')}
      <div class="card stack">
        <div class="grid-2"><div class="field"><label for="btA">先攻</label><select class="input" id="btA">${opts}</select></div>
        <div class="field"><label for="btB">後攻</label><select class="input" id="btB">${opts}</select></div></div>
        <div class="field"><span class="lbl">分野</span>${catSeg('bcat',cat)}</div>
        <button class="btn lg block" type="button" data-act="go">${icon('users')}バトル開始</button>
        <p class="tiny faint">対戦結果はその場限りで、個人の進捗には記録されません。</p></div>`;
    $('#btA',el).value=META.active;$('#btB',el).value=(META.list.find(p=>p.id!==META.active)||META.list[1]).id;
  };
  const head=turn=>`<div class="vs"><div class="p${turn===0?' turn':''}">${avatarHtml(A,28)}<div class="small">${esc(A.name)}</div><div class="sc">${sc[0]}</div></div><div class="x">VS</div>
    <div class="p${turn===1?' turn':''}">${avatarHtml(B,28)}<div class="small">${esc(B.name)}</div><div class="sc">${sc[1]}</div></div></div>`;
  const q=()=>{
    const turn=k%2,pl=turn?B:A,it=items[k];
    el.innerHTML=`${backbar('やめる','setup')}${head(turn)}
      <div class="card mt"><p class="center"><b>${esc(pl.name)}</b> の番(第${Math.floor(k/2)+1}ラウンド)</p><div data-q></div>
      <div class="row center mt"><button class="btn quiet sm" type="button" data-act="pass">パス(0点)</button></div></div>`;
    cur=timedQuestion($('[data-q]',el),it,5,r=>{
      sc[turn]+=r.score;
      cur.res.innerHTML=timedResultHtml(it,r);
      $$('.vs .sc',el)[turn].textContent=sc[turn];
      timers.push(setTimeout(()=>{if(cur){cur.cleanup();cur=null;}k++;k>=ROUNDS?done():q();},2600));
    });
  };
  const done=()=>{
    const w=sc[0]===sc[1]?null:sc[0]>sc[1]?A:B;
    el.innerHTML=`${backbar('練習メニュー','home')}${head(-1)}
      <div class="card center mt"><div class="eyebrow">結果</div><h2 class="mt-s">${w?`${esc(w.name)} の勝ち!`:'引き分け!'}</h2>
      <div class="row center mt"><button class="btn" type="button" data-act="rematch">再戦</button><button class="btn ghost" type="button" data-act="setup">メンバー変更</button></div></div>`;
  };
  setup();
  el.onclick=e=>{
    const sg=e.target.closest('[data-seg] button');if(sg){cat=sg.dataset.v;$$('[data-seg] button',el).forEach(x=>x.classList.toggle('on',x===sg));return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='home')PracticeView.open('home');
    else if(a==='members')openMembers().then(()=>setup());
    else if(a==='setup'){timers.forEach(clearTimeout);if(cur){cur.cleanup();cur=null;}TTS.stop();setup();}
    else if(a==='go'){const a1=$('#btA',el).value,b1=$('#btB',el).value;if(a1===b1){toast('別のメンバーを2人選んでください');return;}
      A=META.list.find(x=>x.id===a1);B=META.list.find(x=>x.id===b1);items=flashBank(cat).slice(0,ROUNDS);k=0;sc=[0,0];q();}
    else if(a==='rematch'){items=flashBank(cat).slice(0,ROUNDS);k=0;sc=[0,0];q();}
    else if(a==='pass'){if(cur)cur.pass();}
  };
  return ()=>{timers.forEach(clearTimeout);if(cur)cur.cleanup();};
};

/* ============================================================
   MedSpeak — AI会話
   エンジンは自動選択:
     claude.ai 上      → sample 機能(閲覧者のClaudeプランで動く・APIキー不要)
     Macアプリ/Web版   → Claude API(設定でAPIキーを入れた場合のみ・キーは端末内に保存)
     どちらも無い時    → 内蔵エンジン(無料・オフライン)
   ============================================================ */
const AI_MODELS=[
  {id:'claude-opus-5',label:'Claude Opus 5(最高品質)',in:5,out:25},
  {id:'claude-sonnet-5',label:'Claude Sonnet 5(バランス)',in:2,out:10},
  {id:'claude-haiku-4-5',label:'Claude Haiku 4.5(低コスト)',in:1,out:5}
];
const SDK_URL='https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm';
function hasApiKey(){return !ENV.artifact&&!!(DEV.ai.key||'').trim();}
function aiEngine(){if(Cap.sample&&!Cap.sampleDenied)return 'sample';if(hasApiKey())return 'api';return 'local';}
function aiEngineLabel(){const e=aiEngine();
  if(e==='sample')return {cls:'live',t:'Claude(claude.ai)'};
  if(e==='api'){const m=AI_MODELS.find(x=>x.id===DEV.ai.model)||AI_MODELS[0];return {cls:'live',t:m.label.replace(/[((].*$/,'')};}
  return {cls:'local',t:'内蔵エンジン(オフライン)'};}
function aiUsageToday(){const u=DEV.ai.usage;if(u.date!==todayStr()){u.date=todayStr();u.calls=0;u.inTok=0;u.outTok=0;}return u;}
function aiCostUSD(u){const m=AI_MODELS.find(x=>x.id===DEV.ai.model)||AI_MODELS[0];return (u.inTok*m.in+u.outTok*m.out)/1e6;}

/* ---------- Claude API(公式SDKを必要な時だけ読み込む) ---------- */
let _sdk=null;
async function anthropicClient(){
  if(!_sdk){try{_sdk=(await import(SDK_URL)).default;}catch(e){throw {code:'sdk',message:'AI部品を読み込めませんでした。インターネット接続を確認してください。'};}}
  return new _sdk({apiKey:DEV.ai.key.trim(),dangerouslyAllowBrowser:true,maxRetries:1});
}
const TURN_SCHEMA={type:'object',additionalProperties:false,required:['reply','reply_ja','feedback','hints','end'],properties:{
  reply:{type:'string'},reply_ja:{type:'string'},
  feedback:{type:'object',additionalProperties:false,required:['better','note_ja'],properties:{better:{type:'string'},note_ja:{type:'string'}}},
  hints:{type:'array',items:{type:'string'}},end:{type:'boolean'}}};
const REVIEW_SCHEMA={type:'object',additionalProperties:false,required:['scores','summary_ja','good_ja','fixes','phrases','case_ja'],properties:{
  scores:{type:'object',additionalProperties:false,required:['fluency','grammar','vocabulary','communication'],properties:{
    fluency:{type:'integer'},grammar:{type:'integer'},vocabulary:{type:'integer'},communication:{type:'integer'}}},
  summary_ja:{type:'string'},good_ja:{type:'array',items:{type:'string'}},
  fixes:{type:'array',items:{type:'object',additionalProperties:false,required:['you','better','why_ja'],properties:{you:{type:'string'},better:{type:'string'},why_ja:{type:'string'}}}},
  phrases:{type:'array',items:{type:'object',additionalProperties:false,required:['en','ja'],properties:{en:{type:'string'},ja:{type:'string'}}}},
  case_ja:{type:'string'}}};
async function apiJSON(system,messages,schema,effort,maxTokens){
  const u=aiUsageToday();
  if(u.calls>=(DEV.ai.limit||100))throw {code:'limit',message:`本日のAI利用上限(${DEV.ai.limit}回)に達しました。設定で変更できます。`};
  const client=await anthropicClient();
  const model=DEV.ai.model||'claude-opus-5';
  /* Haiku 4.5 は effort 非対応(送ると400になる) */
  const oc={format:{type:'json_schema',schema}};
  if(model!=='claude-haiku-4-5')oc.effort=effort;
  const params={model,max_tokens:maxTokens,system,messages,cache_control:{type:'ephemeral'},output_config:oc};
  let r;
  try{
    /* Opus 5 は安全判定で断られた場合に既定の代替モデルへ自動で切り替える */
    if(model==='claude-opus-5')r=await client.beta.messages.create(Object.assign({betas:['server-side-fallback-2026-07-01'],fallbacks:'default'},params));
    else r=await client.messages.create(params);
  }catch(e){
    if(e instanceof _sdk.AuthenticationError)throw {code:'auth',message:'APIキーが無効です。設定を確認してください。'};
    if(e instanceof _sdk.PermissionDeniedError)throw {code:'perm',message:'このAPIキーではこのモデルを使えません。設定でモデルを変更してください。'};
    if(e instanceof _sdk.RateLimitError)throw {code:'rate',message:'混み合っています。少し待ってからもう一度どうぞ。'};
    if(e instanceof _sdk.BadRequestError)throw {code:'bad',message:'リクエストが受け付けられませんでした('+(e.message||'').slice(0,120)+')'};
    if(e instanceof _sdk.APIConnectionError)throw {code:'net',message:'通信できませんでした。インターネット接続を確認してください。'};
    if(e instanceof _sdk.APIError)throw {code:'api',message:`AIサービスのエラー(${e.status||'?'})。時間をおいて再度お試しください。`};
    throw {code:'unknown',message:'AIとの通信に失敗しました。'};
  }
  u.calls++;u.inTok+=(r.usage&&r.usage.input_tokens||0)+(r.usage&&r.usage.cache_read_input_tokens||0)+(r.usage&&r.usage.cache_creation_input_tokens||0);
  u.outTok+=r.usage&&r.usage.output_tokens||0;saveDevice();
  if(r.stop_reason==='refusal')throw {code:'refused',message:'この内容には応答できませんでした。話題や言い方を変えてください。'};
  const txt=(r.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  try{return JSON.parse(txt);}catch(e){throw {code:'json',message:'AIの応答を読み取れませんでした。もう一度どうぞ。',text:txt};}
}

/* ---------- プロンプト ---------- */
function aiSystemPrompt(sess){
  const role=AI_ROLES.find(r=>r.id===sess.role);
  let brief=role.brief.replace('{CASE}',sess.caseEn||'').replace('{TOPIC}',sess.topic||AI_TOPICS_DEFAULT).replace('{CUSTOM}',sess.custom||'a casual conversation');
  return `You are the conversation partner inside "MedSpeak", an English speaking-practice app for a Japanese physician.
${brief}
Learner: ${S.settings.enName||'Yuta'}, a Japanese physician practicing spoken English.
Level: ${AI_LEVELS[sess.level].rule}
The learner's messages come from speech recognition or typing, so ignore punctuation, capitalization and obvious speech-recognition glitches; judge only grammar, word choice and naturalness.
Stay in character and keep the conversation moving: react to what the learner said, then usually ask one question or give a natural prompt. Never answer in Japanese in "reply".
After roughly ${sess.maxTurns} learner turns, or if the learner says goodbye, close the conversation naturally and set "end" to true.
Latency-sensitive; begin your visible answer immediately.

Reply with only a JSON object with these fields:
- "reply": your next line in English.
- "reply_ja": a natural Japanese translation of "reply".
- "feedback": about the learner's LAST message only. If it had a real grammar or word-choice error, or sounded clearly unnatural, set "better" to a more natural English version and "note_ja" to one short Japanese sentence explaining the key point. Otherwise set both to "". Always "" on your opening line.
- "hints": two short, different English sentences the learner could say next (at the learner's level).
- "end": true only when the conversation has reached its close.`;
}
function aiReviewPrompt(sess){
  const role=AI_ROLES.find(r=>r.id===sess.role);
  const tr=sess.turns.map(t=>(t.who==='ai'?'Partner: ':'Learner: ')+t.en).join('\n');
  return `You are an experienced English speaking coach for Japanese physicians. Evaluate the learner's performance in this role-play.
Situation: ${role.title}${sess.role==='patient'?` (standardized patient case: ${sess.caseEn}; diagnosis: ${sess.caseDx})`:''}${sess.role==='custom'?` (${sess.custom})`:''}${sess.role==='conference'?` (topic: ${sess.topic||AI_TOPICS_DEFAULT})`:''}
Learner level setting: ${AI_LEVELS[sess.level].label}

Transcript:
${tr}

Reply with only a JSON object:
- "scores": integers 1-5 for "fluency", "grammar", "vocabulary", "communication" (5 = excellent for a professional setting).
- "summary_ja": 2-3 encouraging, specific sentences in Japanese.
- "good_ja": up to 3 things the learner did well (Japanese).
- "fixes": up to 4 of the most useful corrections, each {"you": the learner's original words, "better": improved English, "why_ja": a short Japanese reason}.
- "phrases": 4 useful English phrases for this situation that the learner did not use, each {"en", "ja"}.
- "case_ja": ${sess.role==='patient'?'in Japanese: the diagnosis and the important history questions the doctor missed':'""'}.`;
}

        <div class="setting" style="padding-bottom:0"><div class="grow"><div class="t">ハンズフリー</div><div class="d">相手が話し終えると自動でマイクが起動(電話のように会話)</div></div>
          <button class="toggle" type="button" role="switch" aria-checked="${this.handsFree}" data-act="hands"></button></div>

        ${h.avg?`<span class="pct">${h.avg.toFixed(1)}<span class="faint small">/5</span></span>`:'<span class="faint small">講評なし</span>'}</div>`).join('')}</div></div>`:''}`;
    el.onclick=e=>{

    };
  },
  captureInputs(){const t=$('#aiTopic');if(t)this.opts.topic=t.value.trim();const c=$('#aiCustom');if(c)this.opts.custom=c.value.trim();},
  begin(){
    const o=this.opts;
    if(o.role==='custom'&&!o.custom){toast('シチュエーションを入力してください');const c=$('#aiCustom');if(c)c.focus();return;}
    const role=AI_ROLES.find(r=>r.id===o.role);
    const cse=o.role==='patient'?rand(AI_CASES):null;
    this.sess={role:o.role,title:role.title,level:o.level,topic:o.topic,custom:o.custom,caseEn:cse?cse.en:'',caseDx:cse?cse.dx:'',
      engine:aiEngine(),turns:[],api:[],maxTurns:o.role==='patient'?14:10,userTurns:0,ended:false,review:null,local:null,started:Date.now()};

  renderChat(){
    const s=this.sess,el=$('#v-ai');
    el.innerHTML=`<div class="backbar"><button class="btn quiet sm" type="button" data-act="quit">${icon('back')}やめる</button><span class="t grow">${esc(s.title)}</span>
        <button class="btn ghost sm" type="button" data-act="hands" title="ハンズフリー">${icon('phone','sm')}${this.handsFree?'ON':'OFF'}</button>
        <button class="btn sm" type="button" data-act="end">${icon('flag','sm')}終了して講評</button></div>
      <div class="chat" id="aiLog">${s.turns.map(t=>this.turnHtml(t)).join('')}</div>
      <div id="aiHints"></div>
      <div id="aiBox"></div>`;
    this.box=SpeakBox($('#aiBox',el),{mode:'free',placeholder:'英語で話す・入力する…',onText:(best)=>this.userSay(best)});
    if(s.ended||s.busy)this.box.setDisabled(true);
    if(s.busy)this.typing(true);
    this.renderHints();
    el.onclick=e=>{
      const b=e.target.closest('[data-act]');

      if(h){const txt=h.dataset.hint;TTS.speak(txt);const ta=$('#aiBox textarea');if(ta){ta.value=txt;ta.focus();}return;}

      else if(a==='save-fix'){this.saveFix(+b.dataset.i);b.disabled=true;b.textContent='復習に追加済み';}
      else if(a==='retry'){const n=$('#aiErr');if(n)n.remove();this.aiTurn(s.pending);}
    };
  },
  turnHtml(t){
    if(t.who==='ai')return bubbleHtml('ai',t.en,t.ja,{label:t.label||''});
    let after='';
    if(t.fb){after=t.fb.better?`<div class="redpen"><div class="lab">${icon('pen','sm')}添削</div><div class="better">${esc(t.fb.better)}</div>${t.fb.note?`<div class="why">${esc(t.fb.note)}</div>`:''}
      <div class="row mt-s" style="gap:6px"><button class="btn ghost sm" type="button" data-say="${esc(t.fb.better)}">${icon('speaker','sm')}聞く</button><button class="btn ghost sm" type="button" data-act="save-fix" data-i="${t.i}">${icon('plus','sm')}復習に追加</button></div></div>`
      :`<div class="redpen" style="background:var(--good-soft);border-color:transparent"><span class="ok">${icon('check','sm')} 自然な英語です</span></div>`;}
    return bubbleHtml('me',t.en,'',{after});
  },
  renderHints(){
    const s=this.sess,box=$('#aiHints');if(!box||!s)return;
    const h=s.hints||[];
    box.innerHTML=h.length&&!s.ended?`<div class="hints"><div class="tiny faint">${icon('bulb','sm')} こう言えます(タップで読み上げ・入力欄へ)</div>${h.map(x=>`<button class="hint-chip" type="button" data-hint="${esc(x.en||x)}">${esc(x.en||x)}${x.ja&&S.settings.showJa?`<span class="ja">${esc(x.ja)}</span>`:''}</button>`).join('')}</div>`:'';
  },
  typing(on){
    const log=$('#aiLog');if(!log)return;
    let t=$('#aiTyping');
    if(on&&!t){log.insertAdjacentHTML('beforeend',`<div class="msg ai" id="aiTyping"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`);scrollEnd(log.lastElementChild);}
    if(!on&&t)t.remove();
  },
  userSay(text){
    const s=this.sess;if(!s||s.busy||s.ended)return;
    const t={who:'me',en:text,i:s.turns.length};
    s.turns.push(t);s.userTurns++;
    const log=$('#aiLog');log.insertAdjacentHTML('beforeend',this.turnHtml(t));scrollEnd(log.lastElementChild);
    logAttempt(clamp(55+text.split(/\s+/).length*3,0,100),AI_ROLES.find(r=>r.id===s.role).cat,null,null,'free');
    bumpTask('ai');
    this.aiTurn(text);
  },
  async aiTurn(userText){
    const s=this.sess;if(!s)return;
    s.busy=true;if(this.box)this.box.setDisabled(true);
    s.hints=[];this.renderHints();
    this.typing(true);
    let out=null,err=null;
    try{
      if(s.engine==='sample')out=await this.viaSample(userText);
      else if(s.engine==='api')out=await this.viaApi(userText);
      else out=this.viaLocal(userText);
    }catch(e){err=e;}
    if(this.sess!==s)return;
    this.typing(false);
    s.busy=false;if(this.box)this.box.setDisabled(false);
    if(err){
      if(err.code==='cancelled')return;
      const perm=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','auth','perm','sdk','limit'];
      if(perm.includes(err.code)){
        if(s.engine==='sample')Cap.sampleDenied=true;
        toast(err.message&&err.code!=='not_granted'?err.message:'AIが使えないため、内蔵エンジンに切り替えます',null,4200);
        s.engine='local';
        out=this.viaLocal(userText);
      }else{
        const log=$('#aiLog');
        s.pending=userText;
        if(log)log.insertAdjacentHTML('beforeend',`<div class="notice" id="aiErr">${icon('warn')}<div class="grow">${esc(err.message||'AIの応答に失敗しました')}</div><button class="btn sm" type="button" data-act="retry">もう一度</button></div>`);
        if(log)scrollEnd(log.lastElementChild);
        return;
      }
    }
    this.applyAi(out,userText);
  },
  applyAi(o,userText){
    const s=this.sess;
    const log=$('#aiLog');
    const last=[...s.turns].reverse().find(t=>t.who==='me');
    if(userText&&last){
      const fb=o.feedback||{};
      last.fb={better:String(fb.better||'').trim(),note:String(fb.note_ja||'').trim()};
      if(last.fb.better&&canonTokens(last.fb.better).map(x=>x.t).join(' ')===canonTokens(last.en).map(x=>x.t).join(' '))last.fb.better='';
      if(log){const nodes=$$('.msg.me',log);const node=nodes[nodes.length-1];if(node)node.outerHTML=this.turnHtml(last);}
    }
    const t={who:'ai',en:String(o.reply||'...').trim(),ja:String(o.reply_ja||'').trim(),label:s.role==='patient'?'PATIENT':''};
    s.turns.push(t);
    s.hints=(Array.isArray(o.hints)?o.hints:[]).slice(0,2).map(x=>typeof x==='string'?{en:x}:x).filter(x=>x&&x.en);
    if(log){log.insertAdjacentHTML('beforeend',this.turnHtml(t));scrollEnd(log.lastElementChild);}
    this.renderHints();
    if(o.end){s.ended=true;if(this.box)this.box.setDisabled(true);
      if(log)log.insertAdjacentHTML('beforeend',`<div class="center mt"><button class="btn" type="button" data-act="end">${icon('flag')}講評を見る</button></div>`);}
    const after=()=>{if(this.handsFree&&!s.ended&&this.sess===s&&this.box&&this.box.mode==='voice'&&App.cur==='ai')setTimeout(()=>{if(this.box&&!s.busy)this.box.start();},350);};
    if(S.settings.autoSpeak&&App.cur==='ai')speakWait(t.en).then(after);else after();
  },
  /* claude.ai の sample 機能 */
  async viaSample(userText){
    const s=this.sess;
    const sys=aiSystemPrompt(s);
    const turns=[{role:'user',content:sys+'\n\n[The role-play starts now. Say your opening line. There is no learner message yet, so "feedback" must have empty strings.]'}];
    recentHist(s.api).forEach(m=>turns.push(m));
    if(userText)turns.push({role:'user',content:userText});
    this.ctl=new AbortController();
    let o;
    try{o=await Cap.sample.json(turns,{modelTier:'quick',cache:false,signal:this.ctl.signal});}
    catch(e){
      if(e&&e.code==='invalid_json'&&e.text)o={reply:e.text.slice(0,400),reply_ja:'',feedback:{better:'',note_ja:''},hints:[],end:false};
      else throw {code:e&&e.code||'upstream_error',message:sampleErrMsg(e)};
    }
    if(userText)s.api.push({role:'user',content:userText});
    s.api.push({role:'assistant',content:JSON.stringify(o)});
    return o;
  },
  async viaApi(userText){
    const s=this.sess;
    const msgs=[{role:'user',content:'[The role-play starts now. Say your opening line. There is no learner message yet, so "feedback" must have empty strings.]'}];
    recentHist(s.api).forEach(m=>msgs.push(m));
    if(userText)msgs.push({role:'user',content:userText});
    const o=await apiJSON(aiSystemPrompt(s),msgs,TURN_SCHEMA,'low',2000);
    if(userText)s.api.push({role:'user',content:userText});
    s.api.push({role:'assistant',content:JSON.stringify(o)});
    return o;
  },
  /* 内蔵エンジン:キーワードに反応して会話を続け、よくある間違いを添削 */
  viaLocal(userText){
    const s=this.sess;
    const topic=AI_ROLES.find(r=>r.id===s.role).cat;
    const d=FREETALK[topic]||FREETALK.daily;
    const L=s.local||(s.local={askedQ:new Set(),usedA:new Set(),usedO:new Set(),n:0});
    const pick=(arr,used)=>{const av=arr.map((_,i)=>i).filter(i=>!used.has(i));const pool=av.length?av:arr.map((_,i)=>i);if(!av.length)used.clear();const i=pool[Math.floor(Math.random()*pool.length)];used.add(i);return arr[i];};
    const hints=d.suggestions.slice(0,2).map(x=>({en:withName(x.en),ja:x.ja}));
    if(!userText){const op=pick(d.openers,L.usedO);return {reply:withName(op.en),reply_ja:withName(op.ja),feedback:{better:'',note_ja:''},hints,end:false};}
    L.n++;
    const fb=localFeedback(userText);
    const low=userText.toLowerCase();
    if(/\b(bye|goodbye|see you|got to go|gotta go|talk later|that's all|i'm done)\b/.test(low)||L.n>=s.maxTurns){
      const c=rand(FT_CLOSERS);return {reply:c.en,reply_ja:c.ja,feedback:fb,hints:[],end:true};}
    const parts=[],ja=[];
    let follow=d.keyword.find(k=>k.re.test(low)&&!L.askedQ.has('k'+k.en));
    if(follow)L.askedQ.add('k'+follow.en);
    if(/\b(thanks|thank you|appreciate)\b/.test(low)){parts.push("You're welcome!");ja.push('どういたしまして!');}
    else if(userText.includes('?')||/^\s*(what|how|why|where|when|who|which|do you|are you|can you|could you|have you|would you|is it)\b/i.test(userText)){const a=pick(d.answers,L.usedA);parts.push(a.en);ja.push(a.ja);follow=null;}
    else if(!follow){parts.push(rand(d.reactions));}
    if(!follow)follow=pick(d.questions,L.askedQ);
    parts.push(follow.en);ja.push(follow.ja);
    return {reply:parts.join(' '),reply_ja:ja.join(' '),feedback:fb,hints,end:false};
  },
  saveFix(i){
    const t=this.sess&&this.sess.turns[i];if(!t||!t.fb||!t.fb.better)return;
    addMyPhrase(t.fb.better,t.fb.note||('あなたの発話: '+t.en),'AI添削');
    toast('復習カードに追加しました');
  },
  async quit(){
    const s=this.sess;
    if(s&&s.userTurns>0&&!s.ended&&!await confirmBox('会話をやめますか?','講評を受けずに終了します。','やめる'))return;
    this.leave();this.sess=null;this.renderStart();
  },
  async finish(){
    const s=this.sess;if(!s)return;
    if(s.userTurns<2){toast('講評には2回以上の発話が必要です');return;}
    if(this.box){this.box.destroy();this.box=null;}
    if(this.ctl){try{this.ctl.abort();}catch(e){}}
    TTS.stop();s.ended=true;this.screen='review';
    const el=$('#v-ai');
    el.innerHTML=`${backbar('AI会話トップ','top')}<div class="card center"><div class="eyebrow">講評を作成中</div><div class="mt"><span class="typing"><i></i><i></i><i></i></span></div><p class="small muted mt">会話全体から、良かった点と直すと良い点をまとめています…</p></div>`;
    el.onclick=e=>{const b=e.target.closest('[data-act]');if(b&&b.dataset.act==='top'){this.sess=null;this.renderStart();}};
    let rv=null,err=null;
    try{
      if(s.engine==='sample'){this.ctl=new AbortController();rv=await Cap.sample.json(aiReviewPrompt(s),{modelTier:'default',cache:false,signal:this.ctl.signal});}
      else if(s.engine==='api')rv=await apiJSON('You are a precise, encouraging English speaking coach. Reply only with the requested JSON.',[{role:'user',content:aiReviewPrompt(s)}],REVIEW_SCHEMA,'medium',6000);
      else rv=localReview(s);
    }catch(e){err=e;}
    if(this.sess!==s)return;
    if(err||!rv){rv=localReview(s);rv.note=(err&&(err.message||sampleErrMsg(err)))||'';}
    s.review=rv;
    const sc=rv.scores||{};const vals=['fluency','grammar','vocabulary','communication'].map(k=>+sc[k]||0).filter(Boolean);
    const avg=vals.length?vals.reduce((a,x)=>a+x,0)/vals.length:0;
    S.aiHist.push({date:todayStr(),title:s.title,turns:s.userTurns,avg:avg||null,dx:s.role==='patient'?s.caseDx:''});
    if(S.aiHist.length>60)S.aiHist=S.aiHist.slice(-60);
    addXP(15);touchStudy();save();
    this.renderReview();
  },
  renderReview(){
    const s=this.sess,rv=s.review,el=$('#v-ai');
    const sc=rv.scores||{};
    const bar=(k,l)=>{const v=clamp(+sc[k]||0,0,5);return `<div class="sbar"><span>${l}</span><div class="track"><i style="width:${v*20}%"></i></div><span class="n">${v||'–'}</span></div>`;};
    el.innerHTML=`${backbar('AI会話トップ','top')}
      ${vh('講評',`${esc(s.title)} ・ ${s.userTurns}往復`)}
      ${rv.note?`<div class="notice">${icon('info')}<div class="grow">AIの講評を取得できなかったため、内蔵の簡易講評を表示しています。(${esc(rv.note)})</div></div>`:''}
      ${s.role==='patient'?`<div class="card" style="border-color:var(--accent)"><div class="eyebrow">症例の答え</div><h2 class="mt-s">${esc(s.caseDx)}</h2>${rv.case_ja?`<p class="small mt-s">${esc(rv.case_ja)}</p>`:''}</div>`:''}
      <div class="card"><h2>評価(5段階)</h2><div class="scorebars mt">${bar('fluency','流暢さ')}${bar('grammar','文法')}${bar('vocabulary','語彙')}${bar('communication','伝える力')}</div>
        ${rv.summary_ja?`<p class="mt" style="line-height:1.75">${esc(rv.summary_ja)}</p>`:''}</div>
      ${(rv.good_ja||[]).length?`<div class="card"><h2>良かった点</h2><ul class="small mt-s" style="padding-left:18px;line-height:1.8">${rv.good_ja.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`:''}
      ${(rv.fixes||[]).length?`<div class="card"><div class="card-head"><h2 class="grow">直すともっと良くなる点</h2><button class="btn ghost sm" type="button" data-act="save-fixes">${icon('plus','sm')}全部を復習に追加</button></div>
        ${rv.fixes.map(f=>`<div class="fix"><div class="you">${esc(f.you)}</div><div class="better">${esc(f.better)} <button class="icon-btn" type="button" data-say="${esc(f.better)}" aria-label="読み上げ" style="width:30px;height:30px">${icon('speaker','sm')}</button></div><div class="why">${esc(f.why_ja)}</div></div>`).join('')}</div>`:''}
      ${(rv.phrases||[]).length?`<div class="card"><div class="card-head"><h2 class="grow">この場面で使えるフレーズ</h2><button class="btn ghost sm" type="button" data-act="save-phrases">${icon('plus','sm')}復習に追加</button></div>
        ${rv.phrases.map(p=>`<div class="res-row"><div class="grow"><div class="en">${esc(p.en)}</div><div class="ja">${esc(p.ja)}</div></div><button class="icon-btn" type="button" data-say="${esc(p.en)}" aria-label="読み上げ">${icon('speaker','sm')}</button></div>`).join('')}</div>`:''}
      <div class="row mt"><button class="btn" type="button" data-act="again">${icon('refresh')}同じ設定でもう一度</button><button class="btn ghost" type="button" data-act="top">別の場面を選ぶ</button></div>`;
    el.onclick=e=>{
      const b=e.target.closest('[data-act]');if(!b)return;
      const a=b.dataset.act;
      if(a==='top'){this.sess=null;this.renderStart();}
      else if(a==='again'){this.sess=null;this.begin();}
      else if(a==='save-fixes'){(rv.fixes||[]).forEach(f=>addMyPhrase(f.better,f.why_ja,'AI講評'));b.disabled=true;toast(`${(rv.fixes||[]).length}件を復習カードに追加しました`);}
      else if(a==='save-phrases'){(rv.phrases||[]).forEach(p=>addMyPhrase(p.en,p.ja,'AI講評'));b.disabled=true;toast(`${(rv.phrases||[]).length}件を復習カードに追加しました`);}
    };
  }
};
function recentHist(arr){let h=arr.slice(-40);while(h.length&&h[0].role!=='assistant')h=h.slice(1);return h;}
function sampleErrMsg(e){
  const c=e&&e.code;
  return ({rate_limited:'Claudeの利用が混み合っているか、利用上限に達しました。少し待ってからもう一度どうぞ。',
    session_expired:'claude.ai に再度サインインしてください。',refused:'この内容には応答できませんでした。言い方を変えてください。',
    not_granted:'Claudeの利用が許可されませんでした。',sampling_disabled:'このアカウントではClaudeを利用できません。',
    empty_completion:'応答が空でした。もう一度どうぞ。',prompt_too_large:'会話が長くなりすぎました。講評に進んでください。'})[c]
    ||(e&&e.message&&!/^[a-z_]+$/.test(e.message)?e.message:'AIの応答に失敗しました。もう一度どうぞ。');
}
/* 内蔵の添削(よくある間違い) */
function localFeedback(text){
  let better=text;const notes=[];
  for(const m of MISTAKES){
    if(!m.re.test(better))continue;
    better=better.replace(m.re,(...a)=>{
      const match=a[0];
      let r=typeof m.rep==='function'?m.rep(...a):m.rep.replace(/\$(\d)/g,(_,i)=>a[+i]||'');
      if(/^[A-Z]/.test(match))r=r.charAt(0).toUpperCase()+r.slice(1);
      return r;});
    notes.push(m.note);
  }
  return notes.length?{better,note_ja:notes.join(' / ')}:{better:'',note_ja:''};
}
function localReview(s){
  const mine=s.turns.filter(t=>t.who==='me');
  const words=mine.reduce((a,t)=>a+t.en.split(/\s+/).length,0);
  const per=mine.length?words/mine.length:0;
  const fixes=mine.filter(t=>t.fb&&t.fb.better).slice(0,4).map(t=>({you:t.en,better:t.fb.better,why_ja:t.fb.note||''}));
  const flu=clamp(Math.round(per/2.2),1,5);
  return {scores:{fluency:flu,grammar:clamp(5-fixes.length,1,5),vocabulary:clamp(Math.round(per/2.6),1,5),communication:clamp(Math.round(mine.length/1.6),1,5)},
    summary_ja:`${mine.length}回発話し、1回あたり平均${per.toFixed(1)}語でした。${per<6?'次は理由や具体例を1つ足して、1回の発話を長くしてみましょう。':'十分な長さで話せています。質問を返して会話を広げるとさらに自然です。'}`,
    good_ja:[mine.length>=5?'最後まで会話を続けられました':'英語で会話を始められました'],fixes,
    phrases:[{en:"Could you tell me a little more about that?",ja:'もう少し詳しく教えてもらえますか?'},{en:"That's a good point. Let me think about it.",ja:'いい指摘ですね。少し考えさせてください。'},
      {en:"What I mean is that...",ja:'つまり、私が言いたいのは…'},{en:"Just to make sure I understand, ...",ja:'理解を確認させてください、…'}],case_ja:s.role==='patient'?'内蔵エンジンでは症例の詳しい講評はできません。':''};
}

/* ============================================================
   MedSpeak — 復習:間隔反復(SRS) / 苦手フレーズ特訓 / マイフレーズ
   ============================================================ */
function myCards(){return (S.myPhrases||[]).map(p=>({id:'u:'+p.id,cat:'mine',en:p.en,ja:p.ja,note:p.note,src:p.src}));}
function allCards(){return PHRASES.concat(myCards());}
function deckCards(deck){return deck==='mine'?myCards():deck==='all'?allCards():PHRASES.filter(p=>p.cat===deck);}
function newLeft(){const D=dayState();return Math.max(0,(S.settings.newPerDay||10)-(D.newCards||0));}
function srsDue(deck){
  const t=todayStr();
  const cards=deckCards(deck||'all');
  const rev=cards.filter(c=>S.srs[c.id]&&S.srs[c.id].due<=t);
  const fresh=cards.filter(c=>!S.srs[c.id]);
  return {rev,fresh,newN:Math.min(newLeft(),fresh.length)};
}
function srsDueCount(deck){const d=srsDue(deck);return d.rev.length+d.newN;}
function masteredCount(){return Object.values(S.srs).filter(c=>c.reps>=3).length;}
function srsIntervals(id){
  const c=S.srs[id]||{ease:2.3,interval:0,reps:0};
  const iv=g=>{if(g===0)return 0;const r=c.reps+1;if(r===1)return g===2?2:1;if(r===2)return g===2?4:3;return Math.max(1,Math.round(c.interval*(g===2?c.ease+.15:c.ease*.85)));};
  return [iv(0),iv(1),iv(2)];
}
function srsGrade(id,g){
  const isNew=!S.srs[id];
  const c=S.srs[id]||{ease:2.3,interval:0,reps:0,lapses:0};
  const ivs=srsIntervals(id);
  if(g===0){c.reps=0;c.interval=0;c.lapses=(c.lapses||0)+1;c.ease=Math.max(1.5,c.ease-.2);}
  else{c.reps++;c.interval=ivs[g];c.ease=g===2?Math.min(3,c.ease+.1):Math.max(1.5,c.ease-.05);}
  c.due=addDays(todayStr(),c.interval);c.last=Date.now();
  S.srs[id]=c;
  if(isNew){dayState().newCards++;}
  bumpTask('review');addXP(3);touchStudy();markActive();saveSoon();
}
function addMyPhrase(en,ja,src){
  en=String(en||'').trim();if(!en)return false;
  const key=canonTokens(en).map(x=>x.t).join(' ');
  if((S.myPhrases||[]).some(p=>canonTokens(p.en).map(x=>x.t).join(' ')===key))return false;
  const id=(S.myPhrases.reduce((m,p)=>Math.max(m,p.id),0)||0)+1;
  S.myPhrases.push({id,en,ja:String(ja||'').trim(),src:src||'',date:todayStr()});
  saveSoon();App.refreshBadges();return true;
}
function fmtIv(d){return d===0?'今日':d===1?'1日後':d<30?d+'日後':Math.round(d/30)+'か月後';}

let RV_DECK='all';
const ReviewView={

        <button class="list-item" type="button" data-act="weak">${tile('neutral',icon('flag'))}<div class="grow"><div class="t">苦手フレーズ特訓</div><div class="d">${weakN}件 ・ 80%以上を2回で卒業</div></div>${icon('chev','chev')}</button>
        <button class="list-item" type="button" data-act="mine" style="margin-top:0">${tile('neutral',icon('pen'))}<div class="grow"><div class="t">マイフレーズ</div><div class="d">${nMine}件 ・ AI添削から保存・自分で追加</div></div>${icon('chev','chev')}</button>
      </div>`;

    el.onclick=e=>{

      if(e.target.closest('#rvFlip')&&!e.target.closest('button')){this.flip();return;}

    };
  },
  valid(c){return deckCards(RV_DECK).some(x=>x.id===c.id);},
  pick(due,force){
    const excl=this.lastId;
    const rev=due.rev.slice().sort((a,b)=>(S.srs[a.id].due<S.srs[b.id].due?-1:S.srs[a.id].due>S.srs[b.id].due?1:(S.srs[a.id].last||0)-(S.srs[b.id].last||0)));
    const r=rev.filter(c=>c.id!==excl);
    if(r.length)return r[0];
    if(due.newN>0||(force&&due.fresh.length))return due.fresh[0];
    if(rev.length)return rev[0];
    if(force||this.extra){const all=deckCards(RV_DECK).filter(c=>S.srs[c.id]&&c.id!==excl).sort((a,b)=>S.srs[a.id].due<S.srs[b.id].due?-1:1);return all[0]||null;}
    return null;
  },
  cardHtml(c,st){
    this.flipped=false;
    const ivs=srsIntervals(c.id);
    const label=c.cat==='mine'?'<span class="tag red">マイフレーズ</span>':catTag(c.cat);
    return `<div class="flash" id="rvFlip" role="button" tabindex="0" aria-label="タップで答えを表示">

        <div class="back" id="rvBack" hidden>${esc(c.en)}</div>
        <div class="flip-hint" id="rvHint">英語で言ってから、タップで答え合わせ</div>
      </div>
      <div class="row center mt"><button class="btn ghost sm" type="button" data-say="${esc(c.en)}">${icon('speaker')}英語を聞く</button><button class="btn ghost sm" type="button" data-act="flip">答えを見る</button></div>

        <button class="g2" type="button" data-act="g2">すぐ言えた<small>${fmtIv(ivs[2])}</small></button></div>`;
  },
  doneHtml(dueN){
    return `<div class="card center"><div class="rx-mark" style="font-size:34px">✓</div><h2 class="mt-s">今日の復習は完了です</h2>
      <p class="small muted mt-s">間隔をあけて、忘れかけた頃にまた出題されます。${RV_DECK==='mine'&&!(S.myPhrases||[]).length?'AI会話の添削で「復習に追加」するとここに入ります。':''}</p>
      ${deckCards(RV_DECK).length?'<button class="btn ghost mt" type="button" data-act="extra">先取りで続ける</button>':''}</div>`;
  },
  mountSpeak(c){
    this.box=SpeakBox($('#rvBox'),{mode:'sentence',hint:'英語で言って発音チェック',placeholder:'英語で答える…',focus:false,onText:(best,alts,via)=>{
      const res=scoreSpeech(c.en,alts);

    }});
  },
  flip(res){
    if(!this.cur)return;

    back.hidden=false;if(res)back.innerHTML=wordsHtml(res.words);

  },
  grade(g){
    if(!this.cur)return;
    srsGrade(this.cur.id,g);
    this.lastId=this.cur.id;this.cur=null;

  /* ---- 苦手フレーズ特訓 ---- */
  openWeak(){if(App.cur==='review'){this.screen='weak';this.wk=null;this.render();}else App.go('review',{weak:true});},
  renderWeak(){
    const el=$('#v-review');
    const list=Object.values(S.weak||{}).sort((a,b)=>a.worst-b.worst);
    if(!this.wk){
      el.innerHTML=`${backbar('復習','back')}${vh('苦手フレーズ特訓','練習で70%未満だった文を自動で集めています。80%以上を2回で卒業')}

      return;
    }
    const W=this.wk;
    while(W.i<W.keys.length&&!S.weak[W.keys[W.i]])W.i++;

      <div class="prompt-card"><div class="row between"><span class="progress-dots">${W.i+1} / ${W.keys.length}</span><span class="tag bad">最低 ${w.worst}% ・ 卒業まであと${2-(w.wins||0)}回</span></div>
        <div class="target mt-s" id="wkT">${esc(w.en)}</div><div class="target-ja">${esc(w.ja)}</div>

      <div id="wkBox"></div><div class="result" id="wkRes"></div>`;
    this.box=SpeakBox($('#wkBox',el),{mode:'sentence',onText:(best,alts,via)=>{
      const res=scoreSpeech(w.en,alts);

        setTimeout(()=>{if(this.wk===W){W.i++;this.render();}},1500);}

      saveSoon();
      $('#wkRes',el).innerHTML=readoutHtml(res,{via})+(msg?`<p class="center mt-s"><b style="color:var(--good)">${msg}</b></p>`:'');
    }});

    el.onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;
      if(b.dataset.act==='list'){this.wk=null;this.render();}

      const b=e.target.closest('[data-act]');if(!b)return;

    const end=new Date();const dow=end.getDay();
    const start=addDays(today,-(W*7-1)-(6-dow));
    let cells='';
    for(let i=0;i<W*7;i++){
      const d=addDays(start,i);
      if(d>today){cells+='<i style="visibility:hidden"></i>';continue;}
      const n=(S.log[d]||{}).n||0;
      const lv=n===0?'':n<5?'l1':n<15?'l2':n<30?'l3':'l4';
      cells+=`<i class="${lv}${d===today?' today':''}" title="${d}: ${n}回"></i>`;
    }
    return `<div class="heat mt-s">${cells}</div>`;
  },
  bars(){
    const days=[];for(let i=13;i>=0;i--)days.push(addDays(todayStr(),-i));
    const counts=days.map(d=>(S.log[d]||{}).n||0);const mx=Math.max(1,...counts);
    return `<div class="bars">${days.map((d,i)=>`<div class="b${i===13?' today':''}" title="${d}: ${counts[i]}回">${counts[i]?`<span>${counts[i]}</span>`:''}<i style="height:${counts[i]/mx*100}%"></i></div>`).join('')}</div>
      <div class="bar-labels">${days.map((d,i)=>`<span>${i%2===1||i===13?fmtDate(d):''}</span>`).join('')}</div>`;
  },
  cats(){
    return CATS.map(c=>{const a=S.attempts.filter(x=>x.cat===c&&x.kind!=='free');const v=a.length?Math.round(a.reduce((s,x)=>s+x.score,0)/a.length):0;
      return `<div class="catrow"><span>${CATLABEL[c]}</span><div class="track"><i style="width:${v}%;background:var(--${c})"></i></div><span class="n">${a.length?v+'%':'–'}(${a.length})</span></div>`;}).join('');
  },
  ranking(){
    const rows=META.list.map(memberSummary);
    const val=r=>LB_METRIC==='avg'?(r.avg==null?-1:r.avg):r[LB_METRIC];
    rows.sort((a,b)=>val(b)-val(a));
    const fmt=r=>LB_METRIC==='xp'?r.xp+' XP':LB_METRIC==='streak'?r.streak+'日':LB_METRIC==='daysDone'?r.daysDone+'/90':LB_METRIC==='attempts'?r.attempts+'回':(r.avg==null?'–':r.avg+'%');
    return rows.map((r,i)=>`<div class="rank${r.id===META.active?' me':''}"><span class="pos">${i+1}</span>${avatarHtml(r,30)}<div class="grow"><b>${esc(r.name)}</b>${r.id===META.active?' <span class="tiny faint">(あなた)</span>':''}<div class="tiny faint">Lv.${levelOf(r.xp).n} ${esc(levelOf(r.xp).ja)} ・ 連続${r.streak}日</div></div><span class="v">${fmt(r)}</span></div>`).join('');
  },
  milestones(){
    const done=Object.keys(S.daysDone).length,best=Math.max(S.bestStreak||0,currentStreak());
    const list=[[best>=3,'3日連続で練習'],[best>=7,'1週間連続で練習'],[best>=30,'30日連続で練習'],[S.attempts.length>=100,'発話100回'],[S.attempts.length>=500,'発話500回'],
      [masteredCount()>=30,'フレーズ30個を習得'],[masteredCount()>=100,'フレーズ100個を習得'],[(S.aiHist||[]).length>=5,'AI会話を5回'],
      [Object.values(S.osce||{}).some(o=>o.best>=90),'OSCEでA判定'],[done>=30,'第1期(30日)修了'],[done>=60,'第2期(60日)修了'],[done>=90,'全90日修了']];
    return list.map(([ok,t])=>`<div class="ms${ok?' got':''}"><span class="box">${ok?icon('check','sm'):''}</span>${esc(t)}</div>`).join('');
  },

  /* ---- 成長記録(録音) ---- */
  recOK(){return !ENV.artifact&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder&&window.indexedDB);},
  db(){return new Promise((res,rej)=>{if(this._db)return res(this._db);
    let rq;try{rq=indexedDB.open('medspeak_audio',1);}catch(e){return rej(e);}
    rq.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('recs')){const st=db.createObjectStore('recs',{keyPath:'id',autoIncrement:true});st.createIndex('profile','profile',{unique:false});}};
    rq.onsuccess=e=>{this._db=e.target.result;res(this._db);};rq.onerror=()=>rej(rq.error);});},
  async recList(){const db=await this.db();return new Promise((res,rej)=>{const out=[];const tx=db.transaction('recs','readonly');
    const rq=tx.objectStore('recs').index('profile').openCursor(IDBKeyRange.only(META.active));
    rq.onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue();}else res(out);};rq.onerror=()=>rej(rq.error);});},
  async renderRec(){
    const box=$('#recArea');if(!box)return;
    const b=REC_BENCH.find(x=>x.id===REC_BENCH_SEL)||REC_BENCH[0];
    if(!this.recOK()){box.innerHTML=`<p class="small muted">${ENV.artifact?'この公開版では録音できません。Macアプリ版またはWeb版で、Day1の声を残して90日後と聞き比べましょう。':'このブラウザでは録音機能を使えません。'}</p>`;return;}
    box.innerHTML=`<p class="small muted">課題文を音読して録音。30日後・90日後に聞き比べると、上達が耳で分かります(この端末内に保存)。</p>
      <div class="mt">${segHtml('bench',REC_BENCH.map(x=>[x.id,x.label]),b.id)}</div>
      <div class="prompt-card mt"><div class="target" style="font-size:18px">${esc(b.en)}</div><div class="target-ja">${esc(b.ja)}</div></div>
      <div class="row center mt"><button class="btn${this.mr?' danger':''}" type="button" data-act="rec">${icon(this.mr?'stop':'mic')}${this.mr?'停止して保存':'録音する(最長30秒)'}</button></div>
      <div id="recList" class="mt"></div>`;
    try{
      const recs=(await this.recList()).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
      const l=$('#recList');if(!l)return;
      l.innerHTML=recs.length?recs.map(r=>`<div class="rec-item">${icon('mic','sm')}<div class="grow"><b>Day ${r.day}</b> ・ ${esc(r.benchLabel)} ・ ${esc(r.date)}</div>
        <button class="btn ghost sm" type="button" data-act="play" data-id="${r.id}">${icon('play','sm')}再生</button>
        <button class="icon-btn" type="button" data-act="delrec" data-id="${r.id}" aria-label="削除">${icon('trash','sm')}</button></div>`).join('')
        :'<p class="tiny faint center">まだ録音がありません。今日の声を残しておきましょう。</p>';
    }catch(e){const l=$('#recList');if(l)l.innerHTML='<p class="tiny faint">録音の保存領域を開けませんでした。</p>';}
  },
  async toggleRec(){
    if(this.mr){this.mr.stop();return;}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
    catch(e){toast(ENV.native?STT_ERR['mic-denied']:'マイクの使用が許可されていません','',5000);return;}
    const chunks=[];let mr;
    try{mr=new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(t=>t.stop());toast('録音を開始できませんでした');return;}
    this.mr=mr;
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=async()=>{
      clearTimeout(this.recT);stream.getTracks().forEach(t=>t.stop());this.mr=null;
      const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      const b=REC_BENCH.find(x=>x.id===REC_BENCH_SEL)||REC_BENCH[0];
      try{const db=await this.db();await new Promise((res,rej)=>{const tx=db.transaction('recs','readwrite');
        tx.objectStore('recs').add({profile:META.active,day:S.curDay,date:todayStr(),bench:b.id,benchLabel:b.label,blob});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
        toast('録音を保存しました');addXP(5);touchStudy();save();}
      catch(e){toast('保存に失敗しました');}
      this.renderRec();
    };
    mr.start();this.renderRec();
    this.recT=setTimeout(()=>{if(this.mr)this.mr.stop();},30000);
  },
  stopRec(){if(this.mr){try{this.mr.stop();}catch(e){}}},
  async play(id){
    try{const recs=await this.recList();const r=recs.find(x=>x.id===id);if(!r)return;
      TTS.stop();const url=URL.createObjectURL(r.blob);const a=new Audio(url);a.onended=()=>URL.revokeObjectURL(url);await a.play();}
    catch(e){toast('再生できませんでした');}
  },
  async delRec(id){
    if(!await confirmBox('録音を削除しますか?','元に戻せません。','削除',true))return;
    try{const db=await this.db();await new Promise((res,rej)=>{const tx=db.transaction('recs','readwrite');tx.objectStore('recs').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}
    this.renderRec();
  },

  /* ---- 修了証(画像) ---- */
  cert(){
    const cv=document.createElement('canvas');cv.width=1400;cv.height=990;
    const c=cv.getContext('2d'),W=cv.width,H=cv.height;
    const done=Object.keys(S.daysDone).length,complete=done>=90,L=levelOf(S.xp||0);
    c.fillStyle='#FBFCFB';c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(207,62,39,.10)';c.lineWidth=1;
    for(let x=0;x<W;x+=22){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
    for(let y=0;y<H;y+=22){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
    c.fillStyle='#0B7A6F';c.fillRect(0,0,26,H);
    c.strokeStyle='#14201D';c.lineWidth=3;c.strokeRect(70,60,W-130,H-120);c.lineWidth=1;c.strokeRect(84,74,W-158,H-148);
    c.strokeStyle='#0B7A6F';c.lineWidth=4;c.lineJoin='round';c.beginPath();
    const ey=190;[[140,ey],[330,ey],[360,ey-26],[395,ey+30],[430,ey-80],[462,ey+60],[492,ey],[W-150,ey]].forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
    c.textAlign='center';c.fillStyle='#14201D';
    c.font='italic 600 64px Georgia, "Times New Roman", serif';c.fillText(complete?'Certificate of Completion':'Certificate of Progress',W/2,310);
    c.font='24px Georgia, serif';c.fillStyle='#465753';c.fillText('MedSpeak — 90-Day English Speaking Program for Physicians',W/2,360);
    c.font='26px Georgia, serif';c.fillText('This is to certify that',W/2,450);
    c.fillStyle='#0B7A6F';c.font='bold 64px "Hiragino Sans","Yu Gothic",sans-serif';c.fillText(activeMember().name,W/2,540);
    c.fillStyle='#14201D';c.font='26px Georgia, serif';
    c.fillText(complete?'has successfully completed all 90 days of the program.':`has completed ${done} of 90 days and continues to train.`,W/2,610);
    c.font='22px "Hiragino Sans","Yu Gothic",sans-serif';c.fillStyle='#465753';
    c.fillText(`Lv.${L.n} ${L.ja} (${L.en}) ・ 総発話 ${S.attempts.length}回 ・ 平均 ${avgScore()==null?'–':avgScore()+'%'} ・ 最長連続 ${Math.max(S.bestStreak||0,currentStreak())}日`,W/2,670);
    c.font='22px Georgia, serif';c.fillText(new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),W/2,760);
    c.save();c.translate(W-260,H-230);c.rotate(-.24);c.strokeStyle='#CF3E27';c.fillStyle='#CF3E27';c.lineWidth=5;
    c.beginPath();c.arc(0,0,86,0,7);c.stroke();c.lineWidth=2;c.beginPath();c.arc(0,0,74,0,7);c.stroke();
    c.font='bold 56px "Hiragino Mincho ProN","Yu Mincho",serif';c.fillText(complete?'修了':'継続',0,14);c.font='bold 16px sans-serif';c.fillText(`DAY ${done}/90`,0,48);c.restore();
    const url=cv.toDataURL('image/png');
    this._cert=cv;
    $('#certArea').innerHTML=`<img class="cert" src="${url}" alt="修了証">${canSaveFiles()?`<div class="row mt"><button class="btn sm" type="button" data-act="cert-save">${icon('download','sm')}画像を保存</button></div>`:''}`;
  },
  certSave(){
    if(!this._cert)return;
    this._cert.toBlob(async b=>{try{await saveFile('medspeak-certificate.png',b,'image/png');toast('保存しました');}catch(e){const c=(e&&e.code)||e;if(c!=='cancelled'&&c!=='declined')toast('保存できませんでした');}},'image/png');
  }
};

        if(id==='theme'){DEV.theme=v;saveDevice();applyTheme();}
        save();App.refreshBadges();return;}
      const b=e.target.closest('[data-act]');if(!b)return;
      const a=b.dataset.act;
      if(a==='ttstest')this.ttsTest();
      else if(a==='mictest')this.micTest();
      else if(a==='savekey')this.saveKey();
      else if(a==='delkey'){if(await confirmBox('APIキーを削除しますか?','AI会話は内蔵エンジンに戻ります。','削除',true)){DEV.ai.key='';saveDevice();this.render();App.refreshHeader();}}
      else if(a==='export')exportBackup();
      else if(a==='import')$('#importFile').click();
      else if(a==='reset'){if(await confirmBox('学習データをリセットしますか?',`「${activeMember().name}」の進捗・復習カード・記録をすべて消去します。元に戻せません。`,'リセット',true)){resetMember(META.active);toast('リセットしました');App.onMemberChanged();}}
    };
  },
  renderVoices(){
    const vs=$('#sVoice');if(!vs)return;
    if(!TTS.voices.length){vs.innerHTML='<option>(英語の声が見つかりません)</option>';vs.disabled=true;return;}
    vs.disabled=false;
    const good=v=>ENV.native?(v.quality>=2):(!v.local||/natural|neural|premium|enhanced|google/i.test(v.name));
    vs.innerHTML=TTS.voices.map(v=>`<option value="${esc(v.id)}">${good(v)?'★ ':''}${esc(v.name)} (${esc(v.lang)})${ENV.native&&v.quality===3?' プレミアム':ENV.native&&v.quality===2?' 拡張':''}</option>`).join('');
    vs.value=S.settings.voice||TTS.voices[0].id;
  },
  saveKey(){
    const k=$('#sKey');if(!k)return;const v=k.value.trim();
    if(!v){toast('APIキーを入力してください');return;}
    if(!/^sk-ant-/.test(v)){toast('「sk-ant-」で始まるキーを入力してください');return;}
    DEV.ai.key=v;saveDevice();k.value='';toast('APIキーを保存しました。AI会話が使えます');this.render();App.refreshHeader();
  },
  async ttsTest(){
    const r=$('#ttsRes');if(!r)return;
    if(TTS.backend==='none'){r.textContent='この環境は読み上げに対応していません';return;}
    r.textContent='再生中…';const t0=Date.now();
    await TTS.speak("Hello! I'm your English speaking partner. Shall we practice together?");
    const v=TTS.voiceObj();
    r.textContent=Date.now()-t0<500?'すぐに終了しました。音量や出力先(スピーカー/イヤホン)、タブのミュートを確認してください。':`「${v?v.name:'既定の声'}」で再生しました${TTS.forceLocal?'(選んだ声が鳴らなかったため端末内蔵の声に切り替えました)':''}`;
  },
  micTest(){
    const r=$('#micRes');if(!r)return;
    if(this._rec){this._rec.abort();this._rec=null;}
    r.textContent='● 聞いています…英語で話してください';
    this._rec=STT.start({mode:'sentence',onInterim:t=>{r.textContent='● '+t;},onResult:best=>{r.textContent=`認識成功:“${best}”`;},
      onError:err=>{r.textContent=STT_ERR[err]||('エラー: '+err);},onEnd:got=>{this._rec=null;if(!got&&r.textContent.startsWith('●'))r.textContent='聞き取れませんでした。マイクを確認してください';}});
  }
};

/* ---------- テーマ ---------- */
function applyTheme(){
  if(ENV.artifact)return;
  const t=DEV.theme||'auto',root=document.documentElement;
  if(t==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m){const dark=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);m.setAttribute('content',dark?'#0B1412':'#F3F6F5');}
}

/* ---------- バックアップ ---------- */
async function exportBackup(){
  save();
  const data={app:'MedSpeak',ver:3,exported:new Date().toISOString(),meta:META,states:{}};
  META.list.forEach(p=>{data.states[p.id]=p.id===META.active?S:loadStateFor(p.id);});
  try{await saveFile(`medspeak-backup-${todayStr()}.json`,JSON.stringify(data),'application/json');toast(`書き出しました(${META.list.length}人分)`);}
  catch(e){const c=(e&&e.code)||e;if(c!=='cancelled'&&c!=='declined')toast('書き出せませんでした');}
}
function importBackup(file){
  const rd=new FileReader();
  rd.onload=async()=>{
    let data;
    try{data=JSON.parse(rd.result);}catch(e){toast('ファイルを読み取れませんでした');return;}
    if(!data||data.app!=='MedSpeak'||!data.meta||!Array.isArray(data.meta.list)){toast('MedSpeak のバックアップではありません');return;}
    const n=data.meta.list.length;
    if(!await confirmBox('バックアップを復元しますか?',`${(data.exported||'').slice(0,10)} 時点・${n}人分。現在のデータは上書きされます。`,'復元する'))return;
    Store.put(META_KEY,data.meta);
    Object.keys(data.states||{}).forEach(id=>Store.put(stateKey(id),data.states[id]));
    META=loadMeta();S=loadStateFor(META.active);save();
    toast('復元しました');App.onMemberChanged();
  };
  rd.readAsText(file);
}

/* ============================================================
   MedSpeak — アプリ本体:画面遷移 / ヘッダー / 起動
   ============================================================ */
const App={
  cur:null,celebrate:false,
  views:{today:TodayView,practice:PracticeView,ai:AIView,review:ReviewView,records:RecordsView,settings:SettingsView},
  go(v,opts){
    if(!this.views[v])v='today';
    if(this.cur){try{this.views[this.cur].leave();}catch(e){console.error(e);}}
    const prev=this.cur;this.cur=v;
    $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
    $$('.nav-item').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
    try{this.views[v].show(opts||{});}catch(e){console.error(e);$('#v-'+v).innerHTML=`<div class="notice">${icon('warn')}<div>画面の表示中にエラーが発生しました:${esc(e.message||e)}</div></div>`;}
    if(prev!==v)window.scrollTo(0,0);
    try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);}catch(e){}
    this.refreshHeader();
  },
  refreshHeader(){
    const p=activeMember(),st=currentStreak();
    const sn=$('#streakNum');if(sn)sn.textContent=st;
    const sc=$('#streakChip');if(sc)sc.classList.toggle('streak-off',!st||S.lastStudy!==todayStr());
    [['#memberAv','#memberName'],['#memberAv2','#memberName2']].forEach(([a,n])=>{
      const av=$(a),nm=$(n);if(av){av.textContent=initial(p.name);av.style.background=memberColor(p.id);}if(nm)nm.textContent=p.name;});
    this.refreshBadges();
  },
  refreshBadges(){
    const b=$('#dueBadge');if(!b)return;
    const n=srsDueCount('all');b.hidden=!n;b.textContent=n>99?'99+':n;
  },
  onMemberChanged(){
    this.refreshHeader();
    if(this.cur){const v=this.cur;try{this.views[v].leave();}catch(e){}this.cur=null;this.go(v);}
  },
  onVoices(){if(this.cur==='settings')SettingsView.renderVoices();},
  onCaps(){if(this.cur==='today')TodayView.render();else if(this.cur==='ai')AIView.refresh();else if(this.cur==='settings')SettingsView.render();},
  init(){
    applyTheme();
    TTS.init();Cap.init();
    dayState();
    document.addEventListener('click',e=>{
      const say=e.target.closest('[data-say]');
      if(say){e.preventDefault();markActive();TTS.speak(say.dataset.say,{rate:parseFloat(say.dataset.rate)||undefined});return;}
      const go=e.target.closest('[data-go]');
      if(go){e.preventDefault();this.go(go.dataset.go);return;}
      const act=e.target.closest('#topbar [data-act], #nav [data-act]');
      if(act){if(act.dataset.act==='members')openMembers();if(act.dataset.act==='streak')openStreak();}
    });
    $('#importFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f);e.target.value='';});
    /* PCではスペースキーでマイクの開始/停止 */
    document.addEventListener('keydown',e=>{
      if(e.code!=='Space'||e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
      const t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t.tagName)))return;
      if($('.overlay'))return;
      const mic=$('.view.on .mic');if(mic&&!mic.disabled){e.preventDefault();mic.click();}
    });
    const tb=$('#topbar');window.addEventListener('scroll',()=>{if(tb)tb.classList.toggle('scrolled',window.scrollY>4);},{passive:true});
    const flush=()=>{try{save();}catch(e){}};
    window.addEventListener('pagehide',flush);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else{dayState();this.refreshHeader();}});
    if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}}
    window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace('#','');if(this.views[h]&&h!==this.cur)this.go(h);});
    const start=(location.hash||'').replace('#','');
    this.go(this.views[start]?start:'today');
    if(ENV.http&&!ENV.artifact&&!ENV.native&&'serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
    if(ENV.native)Native.send({cmd:'app.ready',version:APP_VERSION});
    setTimeout(()=>this.onboard(),400);
  },
  /* 初回だけ:名前の設定と使い方の案内 */
  onboard(){
    if(DEV.onboarded||S.attempts.length||META.list.length>1||!/^メンバー1$/.test(activeMember().name))return;
    const micNote=ENV.native?'<p class="small mt">初めてマイクを使うとき、macOS が「マイク」と「音声認識」の許可を求めます。<b>「許可」</b>を選んでください。</p>'
      :ENV.artifact?`<p class="small mt">この公開版では、キーボードの音声入力で話します(${dictationTip()})。</p>`:'';
    dialog({title:'MedSpeak へようこそ',html:`<p>医師のための英語スピーキング特訓アプリです。毎日の「処方」(20〜30分)をこなすだけで、90日かけて日常会話 → 医療英語 → 学会英語へと進みます。</p>
      <div class="field mt"><label for="obName">表示名(ランキングや修了証に使います)</label><input class="input" id="obName" maxlength="16" placeholder="例:山田" autofocus></div>
      <div class="field mt"><label for="obEn">英語での呼び名(会話の相手があなたを呼ぶ名前)</label><input class="input" id="obEn" maxlength="20" value="${esc(S.settings.enName||'Yuta')}"></div>
      ${micNote}
      <p class="small mt"><button class="linkbtn" type="button" id="obImport">${icon('upload','sm')}旧版(MedSpeak 1.x)のバックアップを読み込む</button></p>`,
      dismissable:false,cancelValue:false,
      actions:[{label:'はじめる',value:true,onClick:ov=>{
        const n=ov.querySelector('#obName').value.trim(),en=ov.querySelector('#obEn').value.trim();
        if(n)renameMember(META.active,n);
        if(en){S.settings.enName=en;save();}
        DEV.onboarded=true;saveDevice();this.refreshHeader();if(this.cur==='today')TodayView.render();return true;}}],
      onOpen:ov=>{ov.querySelector('#obImport').onclick=()=>{DEV.onboarded=true;saveDevice();ov.remove();$('#importFile').click();};}});
  }
};
App.init();

</script>
